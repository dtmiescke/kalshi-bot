name: kalshi-bot

# Every 12 minutes:
#   crypto  - an 8-minute LIVE streaming burst (BURST_MINUTES) on the 15-minute markets
#   sports  - full scan every 5.5 hours (SPORTS_EVERY_HOURS)
#   always  - grading, learning, AI briefing, weekly model retraining
# Unlimited free minutes on a PUBLIC repo.

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch: {}

concurrency:
  group: kalshi-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # queue the next cycle (see "Queue the next run")

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Nerd preflight - compile all bot modules
        run: python -m compileall -q bot
      - name: Load memory
        id: load-memory
        run: bash .github/load.sh
      # Temporary request: for Oct 26, 2026 in the bot's configured Central timezone,
      # run paper-only and permit up to 25 crypto entries per rolling hour. This is a
      # ceiling, not a quota; existing edge, council, and risk gates still decide.
      # On other dates, preserve the repository's normal mode and hourly cap.
      - name: Set temporary crypto research limits
        id: daily-limits
        shell: bash
        run: |
          if [ "$(TZ=America/Chicago date +%F)" = "2026-10-26" ]; then
            echo "bot_mode=paper" >> "$GITHUB_OUTPUT"
            echo "crypto_cap=25" >> "$GITHUB_OUTPUT"
            echo "Temporary Oct 26 settings: paper mode, crypto cap 25/hour."
          else
            echo "bot_mode=${{ vars.BOT_MODE == 'live' && vars.LIVE_TRADING_OPERATIONAL_APPROVED != 'yes' && 'paper' || vars.BOT_MODE || 'paper' }}" >> "$GITHUB_OUTPUT"
            echo "crypto_cap=${{ vars.CRYPTO_MAX_TRADES_PER_HOUR || '10' }}" >> "$GITHUB_OUTPUT"
            echo "Using normal repository settings."
          fi
      - name: Run
        id: run
        env:
          BOT_MODE: ${{ steps.daily-limits.outputs.bot_mode }}
          LIVE_TRADING_CONFIRMED: ${{ vars.LIVE_TRADING_OPERATIONAL_APPROVED == 'yes' && vars.LIVE_TRADING_CONFIRMED == 'yes' && 'yes' || 'no' }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_DATA_URL: ${{ vars.KALSHI_DATA_URL }}
          KALSHI_DATA_KEY_ID: ${{ secrets.KALSHI_DATA_KEY_ID }}
          KALSHI_DATA_PRIVATE_KEY: ${{ secrets.KALSHI_DATA_PRIVATE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          # Bounded current-web research; OpenRouter server-tool calls may incur usage charges.
          SPORTS_AI_WEB_SEARCH: ${{ vars.SPORTS_AI_WEB_SEARCH || 'yes' }}
          SPORTS_AI_WEB_SEARCH_TTL_SECONDS: ${{ vars.SPORTS_AI_WEB_SEARCH_TTL_SECONDS || '1800' }}
          OPENROUTER_WEB_SEARCH_MODEL: ${{ vars.OPENROUTER_WEB_SEARCH_MODEL }}
          OPENROUTER_WEB_SEARCH_MAX_PER_RUN: ${{ vars.OPENROUTER_WEB_SEARCH_MAX_PER_RUN || '2' }}
          OPENROUTER_WEB_SEARCH_DAILY_LIMIT: ${{ vars.OPENROUTER_WEB_SEARCH_DAILY_LIMIT || '6' }}
          OPENROUTER_TECH_SCOUT_ENABLED: ${{ vars.OPENROUTER_TECH_SCOUT_ENABLED || 'yes' }}
          OMNIROUTE_URL: ${{ secrets.OMNIROUTE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODELS: ${{ vars.OMNIROUTE_MODELS }}
          LITELLM_URL: ${{ vars.LITELLM_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODELS: ${{ vars.LITELLM_MODELS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPORTS_EVERY_HOURS: ${{ vars.SPORTS_EVERY_HOURS || '5.5' }}
          SPORTS_SCAN_EVENT_BUDGET: ${{ vars.SPORTS_SCAN_EVENT_BUDGET || '150' }}
          SPORTS_SCAN_MARKET_BUDGET: ${{ vars.SPORTS_SCAN_MARKET_BUDGET || '100' }}
          SPORTS_MODE: ${{ vars.SPORTS_MODE || 'configured' }}
          SPORTS_SELECTED: ${{ vars.SPORTS_SELECTED || 'KXNFLGAME,KXNBAGAME,KXMLBGAME,KXNHLGAME,KXNCAAFGAME,KXEPLGAME,KXLALIGAGAME,KXBUNDESLIGAGAME,KXSERIEAGAME,KXLIGUE1GAME,KXUCLGAME,KXUELGAME,KXUECLGAME,KXEREDIVISIEGAME,KXLIGAMXGAME,KXBRASILEIROGAME,KXSAUDIPLGAME' }}
          SPORTS_INTEL_ENABLED: ${{ vars.SPORTS_INTEL_ENABLED || 'yes' }}
          SPORTS_INTEL_EVENT_SEARCH: ${{ vars.SPORTS_INTEL_EVENT_SEARCH || 'yes' }}
          SPORTS_INTEL_EVENT_BUDGET: ${{ vars.SPORTS_INTEL_EVENT_BUDGET || '6' }}
          SPORTS_INTEL_MAX_BOX_SCORES: ${{ vars.SPORTS_INTEL_MAX_BOX_SCORES || '6' }}
          SPORTS_INTEL_TTL_SECONDS: ${{ vars.SPORTS_INTEL_TTL_SECONDS || '1800' }}
          SPORTS_AI_NEWS_REFRESH_MINUTES: ${{ vars.SPORTS_AI_NEWS_REFRESH_MINUTES || '30' }}
          COMBO_RESEARCH_ENABLED: ${{ vars.COMBO_RESEARCH_ENABLED || 'yes' }}
          COMBOS_ENABLED: ${{ vars.COMBOS_ENABLED || 'no' }}
          COMBO_MIN_LEGS: ${{ vars.COMBO_MIN_LEGS || '3' }}
          COMBO_MAX_LEGS: ${{ vars.COMBO_MAX_LEGS || '8' }}
          COMBO_MIN_EDGE: ${{ vars.COMBO_MIN_EDGE || '6' }}
          COMBO_AUDIT_LEAD_SECONDS: ${{ vars.COMBO_AUDIT_LEAD_SECONDS || '300' }}
          BURST_MINUTES: ${{ vars.BURST_MINUTES || '8' }}
          BRIEFING_EVERY_MINUTES: ${{ vars.BRIEFING_EVERY_MINUTES || '12' }}
          LLM_DAILY_LIMIT: ${{ vars.LLM_DAILY_LIMIT || '45' }}
          # Protect eight shared daily calls for the two-review AI council.
          LLM_COUNCIL_RESERVE: ${{ vars.LLM_COUNCIL_RESERVE || '8' }}
          CRYPTO_COMBO_MAX_PER_BET: ${{ vars.CRYPTO_COMBO_MAX_PER_BET || '25' }}
          CRYPTO_COMBO_MIN_LEG_EDGE: ${{ vars.CRYPTO_COMBO_MIN_LEG_EDGE || '3' }}
          CRYPTO_COMBO_MIN_EDGE: ${{ vars.CRYPTO_COMBO_MIN_EDGE || '6' }}
          # Keep council calls from consuming all capacity needed for sports event research.
          LLM_WEB_SEARCH_RESERVE: ${{ vars.LLM_WEB_SEARCH_RESERVE || '2' }}
          FIXED_BET: ${{ vars.FIXED_BET }}
          BOT_TIMEZONE: ${{ vars.BOT_TIMEZONE || 'America/Chicago' }}
          ORDER_STYLE: ${{ vars.ORDER_STYLE || 'maker' }}
          # Risk and strategy settings, editable from the phone app (Control > Settings)
          BANKROLL: ${{ vars.BANKROLL || '1000' }}
          MAX_PER_BET: ${{ vars.MAX_PER_BET || '25' }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY || '150' }}
          DAILY_LOSS_LIMIT: ${{ vars.DAILY_LOSS_LIMIT || '30' }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS || '5' }}
          MAX_OPEN_COST: ${{ vars.MAX_OPEN_COST || '200' }}
          AGGRESSION_LEVEL: ${{ vars.AGGRESSION_LEVEL || 'aggressive' }}
          MIN_EDGE: ${{ vars.MIN_EDGE || '3' }}
          CRYPTO_MIN_EDGE: ${{ vars.CRYPTO_MIN_EDGE || '5' }}
          CRYPTO_MAX_TRADES_PER_HOUR: ${{ steps.daily-limits.outputs.crypto_cap }}
          LADDERS_ENABLED: ${{ vars.LADDERS_ENABLED || 'yes' }}
          COUNCIL_MODE: ${{ vars.COUNCIL_MODE || 'advisory' }}
        run: python -m bot.main scheduled
      - name: Nerd postflight - verify persistent database
        id: nerd-postflight
        if: always() && steps.load-memory.outcome == 'success'
        env:
          BOT_DB: data/bot.sqlite
        run: python -m bot.main nerd-check
      - name: Save memory
        id: save-memory
        # Never overwrite the last known-good persistent snapshot after a failed cycle or failed postflight.
        if: steps.run.outcome == 'success' && steps.nerd-postflight.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The save step rebuilds the dashboard + bets.csv, so it needs the same
          # mode/bankroll/timezone as the run. Without these it always showed PAPER.
          BOT_MODE: ${{ steps.daily-limits.outputs.bot_mode }}
          LIVE_TRADING_CONFIRMED: ${{ vars.LIVE_TRADING_OPERATIONAL_APPROVED == 'yes' && vars.LIVE_TRADING_CONFIRMED == 'yes' && 'yes' || 'no' }}
          BANKROLL: ${{ vars.BANKROLL || '1000' }}
          DAILY_LOSS_LIMIT: ${{ vars.DAILY_LOSS_LIMIT || '30' }}
          BOT_TIMEZONE: ${{ vars.BOT_TIMEZONE || 'America/Chicago' }}
        run: bash .github/save.sh
      - name: Queue the next run
        # GitHub's cron skips most */12 runs (about 37 of ~240 fired in two days),
        # so each successful cycle queues the next one on main. The cron stays as
        # the fallback that restarts the chain. A run started with this token via
        # workflow_dispatch is allowed to trigger a new run.
        # Set the repository variable CHAIN_RUNS=no to stop chaining.
        if: >-
          always() && steps.save-memory.outcome == 'success' &&
          github.ref == 'refs/heads/main' && vars.CHAIN_RUNS != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/chain_next.sh
