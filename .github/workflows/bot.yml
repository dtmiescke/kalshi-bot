name: kalshi-bot

# PAPER-ONLY LOCK: scheduled and manual runs stay in paper mode.
# The owner must deliberately edit the workflow and central config to authorize live trading.
# Every 12 minutes (scheduled fallback):
#   crypto  - a LIVE streaming burst on the 15-minute markets, timed to end 4 minutes into a window so every
#             window is read from 20 s before its start to the 90 s bet (BURST_MINUTES is the fallback length)
#   sports  - full scan every 5.5 hours (SPORTS_EVERY_HOURS)
#   always  - grading, learning, AI briefing, gated model retraining
# Unlimited free minutes on a PUBLIC repo.

on:
  # Run one paper-only cycle after reliability workflow/memory-save changes
  # so the live public-data path and persistent snapshot are exercised post-merge.
  push:
    branches: [main]
    paths:
      - ".github/workflows/bot.yml"
      - ".github/load.sh"
      - ".github/save.sh"
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch: {}

concurrency:
  group: kalshi-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # queue the next cycle (see "Queue the next run")
  models: read     # free GitHub Models AI fallback (bot/llm.py)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 245
    # Optional Hugging Face memory (bot/hf_memory.py): unset = bot-data only.
    # Optional Val Town bridge (bot/valtown_bridge.py) for public Kalshi catalog
    # reads; unset = direct Kalshi. Never used for order books or orders.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MEMORY_REPO: ${{ vars.HF_MEMORY_REPO || secrets.HF_MEMORY_REPO }}
      VAL_TOWN_KALSHI_URL: ${{ vars.VAL_TOWN_KALSHI_URL || secrets.VAL_TOWN_KALSHI_URL }}
      ATI_INGEST_SHARED_TOKEN: ${{ secrets.ATI_INGEST_SHARED_TOKEN }}
      # Account, set from the phone app (Settings > Bet settings) through the APP_*
      # repository variables; the values after || are the defaults. STATS_SINCE
      # restarts P/L, balance, win rate and the loss limits from that moment
      # ("Restart stats" in the app); older bets stay in memory and keep teaching
      # the bot. Keep these two lines identical in bot.yml and clear-pause.yml.
      STATS_SINCE: ${{ vars.APP_STATS_SINCE || '2026-10-28T11:45:00Z' }}
      BANKROLL: ${{ vars.APP_BANKROLL || '500' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Nerd preflight - compile all bot modules
        run: python -m compileall -q bot
      - name: Load memory
        id: load-memory
        run: bash .github/load.sh
      - name: Import background training results
        # bot/train_delta.py: rows and models kalshi-train produced without
        # pausing the bot. One transaction; a failure leaves memory untouched.
        if: steps.load-memory.outcome == 'success'
        continue-on-error: true
        run: bash .github/import_training.sh
      # The hourly ceiling is a rolling limit, never a quota. All existing price, edge,
      # settlement, account, and risk checks remain active.
      - name: Set crypto hourly ceiling
        id: daily-limits
        shell: bash
        env:
          BETS_PER_HOUR: ${{ vars.APP_BETS_PER_HOUR || '16' }}
          MAX_BET: ${{ vars.APP_MAX_BET || '20' }}
        run: |
          echo "bot_mode=paper" >> "$GITHUB_OUTPUT"
          echo "crypto_cap=$BETS_PER_HOUR" >> "$GITHUB_OUTPUT"
          # one window = BTC+ETH+SOL+BNB settling together: room for all four at the max bet
          echo "per_window=$(awk -v m="$MAX_BET" 'BEGIN{printf "%.2f", 4*m}')" >> "$GITHUB_OUTPUT"
          echo "Crypto hourly ceiling set; entries are not forced."
      - name: Run
        id: run
        timeout-minutes: 225
        env:
          BOT_MODE: paper
          LIVE_TRADING_CONFIRMED: "no"
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_DATA_URL: ${{ vars.KALSHI_DATA_URL }}
          KALSHI_DATA_KEY_ID: ${{ secrets.KALSHI_DATA_KEY_ID }}
          KALSHI_DATA_PRIVATE_KEY: ${{ secrets.KALSHI_DATA_PRIVATE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          # Bounded current-web research; OpenRouter server-tool calls may incur usage charges.
          SPORTS_AI_WEB_SEARCH: ${{ vars.SPORTS_AI_WEB_SEARCH || 'yes' }}
          SPORTS_AI_WEB_SEARCH_TTL_SECONDS: ${{ vars.SPORTS_AI_WEB_SEARCH_TTL_SECONDS || '1800' }}
          OPENROUTER_WEB_SEARCH_MODEL: ${{ vars.OPENROUTER_WEB_SEARCH_MODEL }}
          OPENROUTER_WEB_SEARCH_MAX_PER_RUN: ${{ vars.OPENROUTER_WEB_SEARCH_MAX_PER_RUN || '2' }}
          OPENROUTER_WEB_SEARCH_DAILY_LIMIT: ${{ vars.OPENROUTER_WEB_SEARCH_DAILY_LIMIT || '6' }}
          OPENROUTER_TECH_SCOUT_ENABLED: ${{ vars.OPENROUTER_TECH_SCOUT_ENABLED || 'yes' }}
          OMNIROUTE_URL: ${{ secrets.OMNIROUTE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODELS: ${{ vars.OMNIROUTE_MODELS }}
          LITELLM_URL: ${{ vars.LITELLM_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODELS: ${{ vars.LITELLM_MODELS }}
          # Free AI fallbacks after OpenRouter (bot/llm.py): GitHub Models uses this
          # run's own token; Gemini needs a free GEMINI_API_KEY secret.
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          GITHUB_MODELS_MODELS: ${{ vars.GITHUB_MODELS_MODELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPORTS_EVERY_HOURS: ${{ vars.SPORTS_EVERY_HOURS || '5.5' }}
          SPORTS_SCAN_EVENT_BUDGET: ${{ vars.SPORTS_SCAN_EVENT_BUDGET || '150' }}
          SPORTS_SCAN_MARKET_BUDGET: ${{ vars.SPORTS_SCAN_MARKET_BUDGET || '100' }}
          SPORTS_MODE: ${{ vars.SPORTS_MODE || 'configured' }}
          SPORTS_SELECTED: ${{ vars.SPORTS_SELECTED || 'KXNFLGAME,KXNBAGAME,KXMLBGAME,KXNHLGAME,KXNCAAFGAME,KXEPLGAME,KXLALIGAGAME,KXBUNDESLIGAGAME,KXSERIEAGAME,KXLIGUE1GAME,KXUCLGAME,KXUELGAME,KXUECLGAME,KXEREDIVISIEGAME,KXLIGAMXGAME,KXBRASILEIROGAME,KXSAUDIPLGAME' }}
          SPORTS_INTEL_ENABLED: ${{ vars.SPORTS_INTEL_ENABLED || 'yes' }}
          SPORTS_INTEL_EVENT_SEARCH: ${{ vars.SPORTS_INTEL_EVENT_SEARCH || 'yes' }}
          SPORTS_INTEL_EVENT_BUDGET: ${{ vars.SPORTS_INTEL_EVENT_BUDGET || '6' }}
          SPORTS_INTEL_MAX_BOX_SCORES: ${{ vars.SPORTS_INTEL_MAX_BOX_SCORES || '6' }}
          SPORTS_INTEL_TTL_SECONDS: ${{ vars.SPORTS_INTEL_TTL_SECONDS || '1800' }}
          SPORTS_AI_NEWS_REFRESH_MINUTES: ${{ vars.SPORTS_AI_NEWS_REFRESH_MINUTES || '30' }}
          COMBO_RESEARCH_ENABLED: ${{ vars.COMBO_RESEARCH_ENABLED || 'yes' }}
          COMBOS_ENABLED: ${{ vars.COMBOS_ENABLED || 'no' }}
          COMBO_MIN_LEGS: ${{ vars.COMBO_MIN_LEGS || '3' }}
          COMBO_MAX_LEGS: ${{ vars.COMBO_MAX_LEGS || '8' }}
          COMBO_MIN_EDGE: ${{ vars.COMBO_MIN_EDGE || '6' }}
          COMBO_AUDIT_LEAD_SECONDS: ${{ vars.COMBO_AUDIT_LEAD_SECONDS || '300' }}
          BURST_MINUTES: ${{ vars.BURST_MINUTES || '8' }}
          BRIEFING_EVERY_MINUTES: ${{ vars.BRIEFING_EVERY_MINUTES || '12' }}
          # Evaluate fresh model candidates twice daily; retry insufficient-data,
          # failed or unpromoted candidates after 3 hours. Existing out-of-sample
          # promotion gates stay in force; this does not force bets or promotions.
          TRAIN_EVERY_HOURS: ${{ vars.TRAIN_EVERY_HOURS || '12' }}
          TRAIN_IN_RUN: 'no'   # kalshi-train trains in the background instead
          TRAIN_RETRY_HOURS: ${{ vars.TRAIN_RETRY_HOURS || '3' }}
          LLM_DAILY_LIMIT: ${{ vars.LLM_DAILY_LIMIT || '45' }}
          # Protect eight shared daily calls for the two-review AI council.
          LLM_COUNCIL_RESERVE: ${{ vars.LLM_COUNCIL_RESERVE || '8' }}
          CRYPTO_COMBO_MAX_PER_BET: ${{ vars.APP_MAX_BET || '20' }}
          CRYPTO_COMBO_MIN_LEG_EDGE: ${{ vars.CRYPTO_COMBO_MIN_LEG_EDGE || '3' }}
          CRYPTO_COMBO_MIN_EDGE: ${{ vars.CRYPTO_COMBO_MIN_EDGE || '6' }}
          # Keep council calls from consuming all capacity needed for sports event research.
          LLM_WEB_SEARCH_RESERVE: ${{ vars.LLM_WEB_SEARCH_RESERVE || '2' }}
          FIXED_BET: ${{ vars.FIXED_BET }}
          BOT_TIMEZONE: ${{ vars.BOT_TIMEZONE || 'America/Chicago' }}
          ORDER_STYLE: ${{ vars.ORDER_STYLE || 'maker' }}
          # Bet settings from the phone app (APP_* variables). Defaults: $5-$20 bets,
          # up to 4 coins x 4 fifteen-minute windows = 16 crypto bets an hour (each
          # only when a trade clears the edge checks), stop if the $500 is lost.
          MIN_PER_BET: ${{ vars.APP_MIN_BET || '5' }}
          MAX_PER_BET: ${{ vars.APP_MAX_BET || '20' }}
          MAX_PER_GAME: ${{ vars.APP_MAX_BET || '20' }}
          MAX_PER_DAY: '8000'
          MAX_TOTAL_LOSS: ${{ vars.APP_STOP_LOSS || '500' }}
          MAX_DRAWDOWN: '100'
          MAX_OPEN_POSITIONS: '8'
          MAX_OPEN_COST: ${{ vars.APP_MAX_OPEN_COST || '160' }}
          AGGRESSION_LEVEL: ${{ vars.APP_STYLE || 'aggressive' }}
          MIN_EDGE: ${{ vars.MIN_EDGE || '3' }}
          CRYPTO_MIN_EDGE: ${{ vars.CRYPTO_MIN_EDGE || '5' }}
          # One long stream instead of 10-minute bursts: it ends 4 minutes into a window, saves
          # memory every 10 minutes meanwhile, grades every 5, and hands over early when a
          # deploy or another run is waiting (bot/handoff.py).
          BURST_TARGET_MINUTES: '180'
          GRADE_EVERY_SECONDS: '300'
          PERIODIC_EVERY_SECONDS: '600'
          HANDOFF_CHECK: 'yes'
          SAVE_CMD: bash .github/save.sh
          SAVE_EVERY_SECONDS: '600'
          GITHUB_TOKEN: ${{ github.token }}
          SHRINK_TO_MARKET: ${{ vars.APP_CALIBRATE || 'yes' }}
          MAX_LOSS_PER_BET: ${{ vars.APP_MAX_LOSS_PCT || '20' }}
          CRYPTO_READ_SECONDS: '-20'
          CRYPTO_READ_EVERY_SECONDS: '10'
          CRYPTO_ENTRY_DELAY_SECONDS: '90'
          CRYPTO_MAX_TRADES_PER_HOUR: ${{ steps.daily-limits.outputs.crypto_cap }}
          CRYPTO_MIN_BET: ${{ vars.APP_MIN_BET || '5' }}
          CRYPTO_MAX_PER_BET: ${{ vars.APP_MAX_BET || '20' }}
          CRYPTO_MAX_PER_WINDOW: ${{ steps.daily-limits.outputs.per_window }}
          LADDERS_ENABLED: ${{ vars.LADDERS_ENABLED || 'yes' }}
          COUNCIL_MODE: ${{ vars.COUNCIL_MODE || 'advisory' }}
        run: python -m bot.main scheduled
      - name: Nerd postflight - verify persistent database
        id: nerd-postflight
        if: always() && steps.load-memory.outcome == 'success'
        env:
          BOT_DB: data/bot.sqlite
        run: python -m bot.main nerd-check
      - name: Save memory
        id: save-memory
        # Never overwrite the last known-good persistent snapshot after a failed cycle or failed postflight.
        if: steps.run.outcome == 'success' && steps.nerd-postflight.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The save step rebuilds the dashboard + bets.csv, so it needs the same
          # mode/bankroll/timezone as the run. Without these it always showed PAPER.
          BOT_MODE: paper
          LIVE_TRADING_CONFIRMED: "no"
          BOT_TIMEZONE: ${{ vars.BOT_TIMEZONE || 'America/Chicago' }}
        run: bash .github/save.sh
      - name: Queue the next run
        # GitHub's cron has historically skipped scheduled runs (about 37 of ~240 fired in two days),
        # so each successful cycle queues the next one on main. The cron stays as
        # the fallback that restarts the chain. A run started with this token via
        # workflow_dispatch is allowed to trigger a new run.
        # Set the repository variable CHAIN_RUNS=no to stop chaining.
        # A failed cycle re-queues too (after a short wait, at most twice in a row):
        # one failed save on 2026-10-27 otherwise left the bot idle for 2 hours.
        # A cancelled run (superseded, or stopped by hand) never re-queues.
        if: >-
          !cancelled() && github.ref == 'refs/heads/main' && vars.CHAIN_RUNS != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED: ${{ steps.save-memory.outcome }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "$SAVED" = "success" ]; then
            bash .github/chain_next.sh
          else
            bash .github/chain_next.sh after-failure
          fi
