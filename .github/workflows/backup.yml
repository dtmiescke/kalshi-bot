name: weekly-memory-backup

# A weekly copy of the bot's memory as a GitHub Release (keeps the newest 4),
# separate from bot-data and Hugging Face. Read-only: no lock needed, the bot
# keeps running.
on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Optional Hugging Face memory (bot/hf_memory.py): unset = bot-data only.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MEMORY_REPO: ${{ vars.HF_MEMORY_REPO || secrets.HF_MEMORY_REPO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load memory
        run: bash .github/load.sh
      - name: Back up to a release
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_KEEP: ${{ vars.BACKUP_KEEP || '4' }}
        run: bash .github/backup_release.sh data/bot.sqlite
