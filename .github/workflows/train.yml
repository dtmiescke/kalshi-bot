name: kalshi-train

# Daily at 09:07 UTC: download a bounded sample of REAL settled Kalshi
# 15-minute windows, add them to the training set, retrain, and promote only if
# the new model beats Kalshi AND the current champion on unseen data. Then a
# backtest, the regression tests and the report go to the log (read-only).
# Shares the bot's concurrency group, so it never runs alongside a trading run.
# Run it by hand (Actions -> kalshi-train -> Run workflow) any time.

on:
  schedule:
    - cron: "7 9 * * *"         # daily 09:07 UTC; UTC avoids DST-dependent local-time claims
  # Narrow recovery hook: only a deliberate marker-file commit starts an extra run.
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-recovery-trigger"
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to download (1-90)"
        default: "3"
        required: true

concurrency:
  group: kalshi-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # restart the bot's run chain after training

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Optional Hugging Face memory (bot/hf_memory.py): unset = bot-data only.
    # Optional Val Town bridge (bot/valtown_bridge.py) for public Kalshi catalog
    # reads; unset = direct Kalshi. Never used for order books or orders.
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MEMORY_REPO: ${{ vars.HF_MEMORY_REPO || secrets.HF_MEMORY_REPO }}
      VAL_TOWN_KALSHI_URL: ${{ vars.VAL_TOWN_KALSHI_URL || secrets.VAL_TOWN_KALSHI_URL }}
      ATI_INGEST_SHARED_TOKEN: ${{ secrets.ATI_INGEST_SHARED_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load memory
        run: bash .github/load.sh
      - name: Download history + train
        id: train-cycle
        # 10 min download + at most 25 min training, with room for the last fit
        # to finish after its checkpoint; the job itself allows 90.
        timeout-minutes: 60
        env:
          # Bound the amount of history per series so slow historical endpoints
          # cannot consume the whole runner allocation. Override in repo vars.
          DAYS: ${{ github.event.inputs.days || '3' }}
          HISTORY_MAX_MARKETS: ${{ vars.HISTORY_MAX_MARKETS || '20' }}
          # the download stops here and keeps what it has (it used to eat the step)
          HISTORY_TIME_LIMIT_MINUTES: ${{ vars.HISTORY_TIME_LIMIT_MINUTES || '10' }}
          PYTHONUNBUFFERED: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ML_MIN_WINDOWS: ${{ vars.ML_MIN_WINDOWS || '300' }}
          ML_MIN_TEST_WINDOWS: ${{ vars.ML_MIN_TEST_WINDOWS || '100' }}
          # stop training cleanly well inside the 90-minute job timeout
          TRAIN_TIME_LIMIT_MINUTES: ${{ vars.TRAIN_TIME_LIMIT_MINUTES || '30' }}
          # signed reads get better rate limits than anonymous GitHub servers
          KALSHI_DATA_URL: ${{ vars.KALSHI_DATA_URL }}
          KALSHI_DATA_KEY_ID: ${{ secrets.KALSHI_DATA_KEY_ID }}
          KALSHI_DATA_PRIVATE_KEY: ${{ secrets.KALSHI_DATA_PRIVATE_KEY }}
        run: |
          case "$DAYS" in
            ''|*[!0-9]*) echo "ERROR: DAYS must be a whole number from 1 to 90." >&2; exit 2 ;;
          esac
          if [ "$DAYS" -lt 1 ] || [ "$DAYS" -gt 90 ]; then
            echo "ERROR: DAYS must be between 1 and 90." >&2
            exit 2
          fi
          # Training gets at most 25 minutes whatever the repo variable says, so
          # download + training always end inside the step's timeout.
          if [ "${TRAIN_TIME_LIMIT_MINUTES%.*}" -gt 25 ] 2>/dev/null; then
            export TRAIN_TIME_LIMIT_MINUTES=25
          fi
          python -m bot.main history "$DAYS"
          python -m bot.main train
      - name: Save memory
        # Keep the last known-good snapshot if history download or training fails.
        if: steps.train-cycle.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The save step rebuilds the dashboard + bets.csv, so it needs the same
          # mode/bankroll/timezone as the run. Without these it always showed PAPER.
          BOT_MODE: paper
          LIVE_TRADING_CONFIRMED: 'no'
          # Same account values as bot.yml (this step rebuilds the dashboard and bets.csv).
          STATS_SINCE: '2026-10-28T11:45:00Z'
          BANKROLL: '500'
          BOT_TIMEZONE: ${{ vars.BOT_TIMEZONE || 'America/Chicago' }}
        run: bash .github/save.sh
      # Read-only audits run AFTER memory is saved and each has a time limit:
      # a backtest with no limit once ran 25+ minutes and held the bot's lock.
      - name: Backtest (read-only audit)
        if: steps.train-cycle.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: python -m bot.main backtest
      - name: Contract rules and MCP-adapter regression tests
        # Exercises the existing read-only normalization and official PDF safety
        # boundaries; no MCP server or second trading client is launched.
        if: steps.train-cycle.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python -m unittest tests.test_market_rules tests.test_contract_pdf tests.test_kalshi_series_metadata tests.test_snapshot_contract_rules -q
      - name: Full regression suite
        # Runs independently even if backtest or focused integration tests fail.
        if: steps.train-cycle.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: python -m unittest discover -s tests -q
      - name: Report (read-only audit)
        if: steps.train-cycle.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: python -m bot.main report
      - name: Restart the bot's run chain
        # bot.yml steps aside while training waits; start it again when done,
        # whether or not training succeeded.
        if: always() && github.ref == 'refs/heads/main' && vars.CHAIN_RUNS != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/chain_next.sh after-training
