name: kalshi-train

# Weekly: download the last 7 days of REAL settled Kalshi 15-minute windows,
# add them to the training set, retrain, and promote only if the new model
# beats Kalshi AND the current champion on unseen data. Run it by hand
# (Actions -> kalshi-train -> Run workflow) right after setup to start trained.

on:
  schedule:
    - cron: "17 4 * * 0"        # Sundays 04:17 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to download (1-90)"
        default: "14"
        required: true

concurrency:
  group: kalshi-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # restart the bot's run chain after training

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load memory
        run: bash .github/load.sh
      - name: Download history + train
        id: train-cycle
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ML_MIN_WINDOWS: ${{ vars.ML_MIN_WINDOWS || '300' }}
          ML_MIN_TEST_WINDOWS: ${{ vars.ML_MIN_TEST_WINDOWS || '100' }}
          # stop training cleanly well inside the 90-minute job timeout
          TRAIN_TIME_LIMIT_MINUTES: ${{ vars.TRAIN_TIME_LIMIT_MINUTES || '45' }}
          # signed reads get better rate limits than anonymous GitHub servers
          KALSHI_DATA_URL: ${{ vars.KALSHI_DATA_URL }}
          KALSHI_DATA_KEY_ID: ${{ secrets.KALSHI_DATA_KEY_ID }}
          KALSHI_DATA_PRIVATE_KEY: ${{ secrets.KALSHI_DATA_PRIVATE_KEY }}
        run: |
          case "$DAYS" in
            ''|*[!0-9]*) echo "ERROR: DAYS must be a whole number from 1 to 90." >&2; exit 2 ;;
          esac
          if [ "$DAYS" -lt 1 ] || [ "$DAYS" -gt 90 ]; then
            echo "ERROR: DAYS must be between 1 and 90." >&2
            exit 2
          fi
          python -m bot.main history "$DAYS"
          python -m bot.main train
      - name: Save memory
        # Keep the last known-good snapshot if history download or training fails.
        if: steps.train-cycle.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The save step rebuilds the dashboard + bets.csv, so it needs the same
          # mode/bankroll/timezone as the run. Without these it always showed PAPER.
          BOT_MODE: ${{ vars.BOT_MODE || 'paper' }}
          LIVE_TRADING_CONFIRMED: ${{ vars.LIVE_TRADING_CONFIRMED || 'no' }}
          BANKROLL: ${{ vars.BANKROLL || '1000' }}
          DAILY_LOSS_LIMIT: ${{ vars.DAILY_LOSS_LIMIT || '30' }}
          BOT_TIMEZONE: ${{ vars.BOT_TIMEZONE || 'America/Chicago' }}
        run: bash .github/save.sh
      - name: Restart the bot's run chain
        # bot.yml steps aside while training waits; start it again when done,
        # whether or not training succeeded.
        if: always() && github.ref == 'refs/heads/main' && vars.CHAIN_RUNS != 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/chain_next.sh after-training
