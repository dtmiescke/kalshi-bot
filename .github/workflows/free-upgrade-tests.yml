name: free-upgrade-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "free-upgrades/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let the newest regression suite finish instead of cancelling it during rapid draft updates.
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate workflow shell scripts
        run: bash -n .github/load.sh .github/save.sh
      - name: Compile all Python modules
        run: python -m compileall -q bot tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
