name: Deploy Kalshi Read-only Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "realtime/kalshi-feed/**"
      - ".github/workflows/deploy-kalshi-feed.yml"

permissions:
  contents: read

concurrency:
  group: deploy-kalshi-readonly-feed
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify Cloudflare deployment secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      # Prefer a dedicated read-only data key if configured. Otherwise reuse
      # the existing bot Kalshi API credentials, avoiding duplicate secrets.
      # The Worker implementation is read-only and rejects account/order channels.
      - name: Resolve existing Kalshi credentials
        env:
          KALSHI_DATA_KEY_ID: ${{ secrets.KALSHI_DATA_KEY_ID || secrets.KALSHI_API_KEY_ID }}
          KALSHI_DATA_PRIVATE_KEY: ${{ secrets.KALSHI_DATA_PRIVATE_KEY || secrets.KALSHI_PRIVATE_KEY }}
        run: |
          test -n "$KALSHI_DATA_KEY_ID" || { echo "::error::No Kalshi API key ID found. Configure the existing KALSHI_API_KEY_ID secret."; exit 1; }
          test -n "$KALSHI_DATA_PRIVATE_KEY" || { echo "::error::No Kalshi private key found. Configure the existing KALSHI_PRIVATE_KEY secret."; exit 1; }

      - uses: actions/checkout@v5
      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Worker configuration
        working-directory: realtime/kalshi-feed
        run: wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and Durable Object
        working-directory: realtime/kalshi-feed
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync existing Kalshi credentials into Cloudflare secrets
        working-directory: realtime/kalshi-feed
        shell: bash
        env:
          KALSHI_DATA_KEY_ID: ${{ secrets.KALSHI_DATA_KEY_ID || secrets.KALSHI_API_KEY_ID }}
          KALSHI_DATA_PRIVATE_KEY: ${{ secrets.KALSHI_DATA_PRIVATE_KEY || secrets.KALSHI_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$KALSHI_DATA_KEY_ID" | wrangler secret put KALSHI_DATA_KEY_ID
          printf '%s' "$KALSHI_DATA_PRIVATE_KEY" | wrangler secret put KALSHI_DATA_PRIVATE_KEY
