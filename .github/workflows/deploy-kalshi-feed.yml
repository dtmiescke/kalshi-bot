name: Deploy Kalshi Read-only Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "realtime/kalshi-feed/**"
      - ".github/workflows/deploy-kalshi-feed.yml"

permissions:
  contents: read

concurrency:
  group: deploy-kalshi-readonly-feed
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare deployment secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      # Prefer dedicated read-only credentials when configured. Existing installations
      # may fall back to the bot's Kalshi key: this Worker signs only the market-data
      # WebSocket handshake and has no order/account API. Never expose credentials to clients.
      - name: Verify Kalshi market-data credentials exist
        env:
          KALSHI_DATA_KEY_ID: ${{ secrets.KALSHI_DATA_KEY_ID || secrets.KALSHI_API_KEY_ID }}
          KALSHI_DATA_PRIVATE_KEY: ${{ secrets.KALSHI_DATA_PRIVATE_KEY || secrets.KALSHI_PRIVATE_KEY }}
        run: |
          test -n "$KALSHI_DATA_KEY_ID" || { echo "::error::Missing KALSHI_DATA_KEY_ID or KALSHI_API_KEY_ID repository secret"; exit 1; }
          test -n "$KALSHI_DATA_PRIVATE_KEY" || { echo "::error::Missing KALSHI_DATA_PRIVATE_KEY or KALSHI_PRIVATE_KEY repository secret"; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Worker configuration
        working-directory: realtime/kalshi-feed
        run: wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync dedicated read-only Kalshi credentials into Cloudflare
        working-directory: realtime/kalshi-feed
        shell: bash
        env:
          KALSHI_DATA_KEY_ID: ${{ secrets.KALSHI_DATA_KEY_ID || secrets.KALSHI_API_KEY_ID }}
          KALSHI_DATA_PRIVATE_KEY: ${{ secrets.KALSHI_DATA_PRIVATE_KEY || secrets.KALSHI_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$KALSHI_DATA_KEY_ID" | wrangler secret put KALSHI_DATA_KEY_ID
          printf '%s' "$KALSHI_DATA_PRIVATE_KEY" | wrangler secret put KALSHI_DATA_PRIVATE_KEY

      - name: Deploy Worker and Durable Object
        working-directory: realtime/kalshi-feed
        shell: bash
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Could not discover the deployed workers.dev URL from Wrangler output."
            exit 1
          fi
          echo "Deployed Worker URL: $WORKER_URL"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 10 "$WORKER_URL/health" -o /tmp/feed-health.json; then
              cat /tmp/feed-health.json
              node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("/tmp/feed-health.json","utf8")); if (h.ok !== true || h.service !== "kalshi-readonly-feed" || h.credentialsConfigured !== true) { console.error("Health check failed: service or credential configuration is not ready"); process.exit(1); }'
              exit 0
            fi
            echo "Health check attempt $attempt/10 failed; retrying shortly."
            sleep 3
          done
          echo "::error::Deployed Worker health check did not pass."
          exit 1

      - name: Verify live WebSocket subscription through deployed relay
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const response = await fetch("https://external-api.kalshi.com/trade-api/v2/markets?status=open&limit=100");
          if (!response.ok) throw new Error("Could not retrieve open markets for smoke test: HTTP " + response.status);
          const body = await response.json();
          const markets = Array.isArray(body.markets) ? body.markets : [];
          const market = markets.find(m => typeof m.ticker === "string" && /^KX[A-Z0-9_-]{2,100}$/.test(m.ticker));
          if (!market) throw new Error("No open KX market ticker found for live feed smoke test");
          console.log("Testing read-only ticker subscription for an open market.");
          const ws = new WebSocket(base.replace(/^https:/, "wss:") + "/ws");
          let finished = false;
          let subscribed = false;
          let marketData = false;
          const timeout = setTimeout(() => {
            if (!finished) {
              finished = true;
              ws.close();
              console.log("Subscription acknowledgement:", subscribed ? "received" : "missing");
              console.log("Ticker market-data update:", marketData ? "received" : "not observed during smoke-test window");
              if (!subscribed && !marketData) process.exitCode = 1;
            }
          }, 15000);
          ws.addEventListener("open", () => console.log("Relay WebSocket handshake succeeded."));
          ws.addEventListener("message", event => {
            let msg;
            try { msg = JSON.parse(String(event.data)); } catch { return; }
            console.log("Relay message type:", String(msg.type || "unknown").slice(0, 40));
            if (msg.type === "relay_status" && msg.status === "connected" && !subscribed) {
              ws.send(JSON.stringify({ id: 1, cmd: "subscribe", params: { channels: ["ticker"], market_tickers: [market.ticker], send_initial_snapshot: true } }));
              console.log("Requested ticker channel for an open market.");
              return;
            }
            if ((msg.type === "subscribed" || msg.type === "subscription") && (msg.msg?.channel === "ticker" || msg.channel === "ticker" || msg.msg?.sid !== undefined)) {
              subscribed = true;
              console.log("Kalshi accepted ticker subscription.");
            }
            if (msg.type === "ticker" && (msg.msg?.market_ticker === market.ticker || msg.msg?.ticker === market.ticker)) {
              marketData = true;
              console.log("Live ticker update received for the test market.");
            }
            if (msg.type === "relay_status" && msg.status === "error" || msg.type === "relay_error" || msg.type === "error") {
              console.error("WebSocket smoke-test error:", msg.type, msg.message || msg.msg?.msg || "");
              if (!subscribed && !marketData) process.exitCode = 1;
            }
          });
          ws.addEventListener("error", () => {
            if (!finished) { finished = true; clearTimeout(timeout); console.error("Relay WebSocket connection failed."); process.exitCode = 1; }
          });
          ws.addEventListener("close", () => {
            if (!subscribed && !marketData && !finished) { finished = true; clearTimeout(timeout); console.error("Relay closed before subscription or market data was confirmed."); process.exitCode = 1; }
          });
          process.on("exit", () => clearTimeout(timeout));
          NODE
