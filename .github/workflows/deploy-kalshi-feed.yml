name: Deploy Kalshi Read-only Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "realtime/kalshi-feed/**"
      - ".github/workflows/deploy-kalshi-feed.yml"

permissions:
  contents: read

concurrency:
  group: deploy-kalshi-readonly-feed
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Cloudflare deployment secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      # Fail closed: never copy the bot's trading credentials into the
      # public-facing read-only feed. Configure a dedicated least-privilege
      # Kalshi market-data key for this service.
      - name: Verify dedicated Kalshi read-only data credentials exist
        env:
          KALSHI_DATA_KEY_ID: ${{ secrets.KALSHI_DATA_KEY_ID }}
          KALSHI_DATA_PRIVATE_KEY: ${{ secrets.KALSHI_DATA_PRIVATE_KEY }}
        run: |
          test -n "$KALSHI_DATA_KEY_ID" || { echo "::error::Missing dedicated KALSHI_DATA_KEY_ID repository secret; trading credentials are intentionally not used as a fallback."; exit 1; }
          test -n "$KALSHI_DATA_PRIVATE_KEY" || { echo "::error::Missing dedicated KALSHI_DATA_PRIVATE_KEY repository secret; trading credentials are intentionally not used as a fallback."; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Worker configuration
        working-directory: realtime/kalshi-feed
        run: wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync dedicated read-only Kalshi credentials into Cloudflare
        working-directory: realtime/kalshi-feed
        shell: bash
        env:
          KALSHI_DATA_KEY_ID: ${{ secrets.KALSHI_DATA_KEY_ID }}
          KALSHI_DATA_PRIVATE_KEY: ${{ secrets.KALSHI_DATA_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "$KALSHI_DATA_KEY_ID" | wrangler secret put KALSHI_DATA_KEY_ID
          printf '%s' "$KALSHI_DATA_PRIVATE_KEY" | wrangler secret put KALSHI_DATA_PRIVATE_KEY

      - name: Deploy Worker and Durable Object
        working-directory: realtime/kalshi-feed
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
