name: real-data-paper-smoke

on:
  pull_request:
    paths:
      - "scripts/real_data_paper_smoke.py"
      - ".github/workflows/real-data-paper-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-data-paper-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOT_MODE: paper
      COMBOS_ENABLED: "no"
      LIVE_TRADING_CONFIRMED: "no"
      LIVE_TRADING_OPERATIONAL_APPROVED: "no"
      KALSHI_API_KEY_ID: ""
      KALSHI_PRIVATE_KEY: ""
      KALSHI_BASE_URL: ""
      KALSHI_DATA_URL: "https://api.elections.kalshi.com/trade-api/v2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only smoke dependencies
        run: python -m pip install requests cryptography
      - name: Read real public Kalshi quotes and simulate paper fills (no exchange writes)
        run: python -m scripts.real_data_paper_smoke
