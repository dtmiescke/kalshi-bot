<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kalshi Bot</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F8FA; --card:#FFFFFF; --line:#E7E9EE; --line2:#F0F1F4; --seg:#ECEEF2;
  --text:#0B0D12; --muted:#4B5361; --muted2:#5B6270;
  --blue:#1F5EFF; --up:#1D4ED8; --down:#C2410C; --orange:#E8763F;
  --yesBg:#F3F6FF; --yesLine:#C9D7FF; --yesText:#1D3FB8;
  --noBg:#FFF6F1; --noLine:#F3D3C3; --noText:#9A3412;
  --chipBg:#E8EEFF; --sportBg:#FFF1E8; --live:#DC2626; --ok:#15803D;
  --warnBg:#FFF7ED; --warnLine:#FED7AA; --warnText:#7C2D12;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E14; --card:#121722; --line:#222A38; --line2:#1A2130; --seg:#1A2130;
  --text:#E8ECF4; --muted:#9AA4B8; --muted2:#9AA4B8;
  --blue:#5B8CFF; --up:#8FB0FF; --down:#FBA574; --orange:#F59E5B;
  --yesBg:#16213D; --yesLine:#2B3F73; --yesText:#A9C1FF;
  --noBg:#2A1A12; --noLine:#5A3220; --noText:#FDBA8C;
  --chipBg:#1C2A4D; --sportBg:#2E1E14; --live:#F87171; --ok:#4ADE80;
  --warnBg:#2A1D10; --warnLine:#5A3A17; --warnText:#FCD9B0;
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;
  padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0));-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
h2{margin:0;font-size:14px;font-weight:600}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 0}
.head .t{display:flex;align-items:center;gap:8px;min-width:0}
.pill{font-size:11px;font-weight:600;letter-spacing:.5px;padding:4px 8px;border-radius:6px;background:var(--chipBg);color:var(--yesText);white-space:nowrap}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.dot.off{background:var(--down)} .dot.live{background:var(--live)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.list{padding:0 14px;gap:0}
.card .cardhead{display:flex;justify-content:space-between;align-items:center;min-height:42px}
.livebadge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--live)}
.q{font-size:15px;font-weight:600}
.chance{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.chance b{font-size:32px;font-weight:700;letter-spacing:-.6px;color:var(--blue)}
.chance span{font-size:14px;font-weight:600;color:var(--blue)}
.chance i{font-style:normal;font-size:13px;font-weight:600}
.chips{display:flex;gap:2px}
.livecard{overflow:hidden}
.slides{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px;scroll-padding:0 16px;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;gap:8px}
.slidetag{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.slidetag b{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text)}
.dots{display:flex;justify-content:center;align-items:center;gap:2px;margin-top:-2px}
.dots button{border:0;background:none;padding:0;height:24px;min-width:18px;display:flex;align-items:center;justify-content:center}
.dots button::after{content:"";width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s}
.dots button[aria-current="true"]::after{width:18px;background:var(--text)}
.dots small{font-size:11px;color:var(--muted2);margin-left:6px}
.chip{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;height:32px;padding:0 10px;border-radius:7px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--card)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--seg);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;height:38px;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.legend{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.legend .keys{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend .keys span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:2px;background:var(--blue)} .sw.dash{height:0;background:none;border-top:2px dashed var(--text)} .sw.entry{height:0;background:none;border-top:2px dashed var(--orange)}
.link{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:600;min-height:40px;padding:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile small{font-size:12px;color:var(--muted)}
.tile b{font-size:20px;font-weight:700}
.tile em{font-style:normal;font-size:11px;color:var(--muted)}
.grid3 .tile{padding:10px;border-radius:12px} .grid3 .tile b{font-size:16px}
.row{width:100%;border:0;border-top:1px solid var(--line2);background:transparent;display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 0;text-align:left;color:inherit}
.card.list .row:first-of-type{border-top:0}
.cardhead + .row{border-top:1px solid var(--line2)!important}
.badge{width:38px;height:38px;border-radius:10px;background:var(--chipBg);color:var(--yesText);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto}
.badge.sport{background:var(--sportBg);color:var(--noText)}
.rowmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowmain b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowmain small{font-size:12px;color:var(--muted)}
.rowend{font-size:14px;font-weight:700;text-align:right;white-space:nowrap}
.chev{color:var(--muted2);flex:0 0 auto}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:38px;border-top:1px solid var(--line2);font-size:13px}
.kv:first-child{border-top:0} .kv span{color:var(--muted)} .kv b{font-weight:600;text-align:right}
.yn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.yn div{border-radius:12px;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:600}
.yn .y{background:var(--yesBg);border:1px solid var(--yesLine);color:var(--yesText)}
.yn .n{background:var(--noBg);border:1px solid var(--noLine);color:var(--noText)}
.yn b{font-size:16px}
.back{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.bar{display:flex;flex-direction:column;height:90px}
.bar .u{height:45px;display:flex;align-items:flex-end} .bar .d{height:45px;display:flex;align-items:flex-start;border-top:1px solid var(--line)}
.bar .u i{width:100%;background:var(--blue);border-radius:3px 3px 0 0} .bar .d i{width:100%;background:var(--orange);border-radius:0 0 3px 3px}
.barlab{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;font-size:10px;color:var(--muted);text-align:center}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;align-items:center;gap:10px;font-size:13px}
.meter .track{height:6px;background:var(--line);border-radius:3px;overflow:hidden} .meter .track i{display:block;height:6px;background:var(--blue)}
.meter b{text-align:right}
.note{font-size:11px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;background:var(--warnBg);border:1px solid var(--warnLine);border-radius:12px;padding:10px 12px;color:var(--warnText);font-size:13px}
.leagues{display:flex;gap:6px;flex-wrap:wrap}
.lg{border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:600;height:34px;padding:0 13px;border-radius:999px}
.lg[aria-pressed="true"]{background:var(--text);color:var(--card);border-color:var(--text)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;height:44px;padding:0 14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--text);color:var(--card);border-color:var(--text)}
.btn.small{height:36px;font-size:13px}
.btn:disabled{opacity:.5}
.empty{padding:22px 8px;text-align:center;font-size:13px;color:var(--muted)}
.samplechip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--warnBg);color:var(--warnText);border:1px solid var(--warnLine)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);color:var(--text);font-size:15px}
pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;color:var(--text)}
.switch{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;min-height:50px;padding:0;text-align:left;color:inherit}
.tog{width:44px;height:26px;border-radius:13px;background:#CBD2DC;padding:3px;display:flex;flex:0 0 auto}
.tog i{width:20px;height:20px;border-radius:50%;background:#fff}
.tog.on{background:var(--blue);justify-content:flex-end}
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(10px + env(safe-area-inset-bottom,0));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:5}
nav#tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px;min-height:50px;font-size:11px;font-weight:600;color:var(--muted2)}
nav#tabs button[aria-current="page"]{color:var(--blue)}
.sheetbg{position:fixed;inset:0;background:rgba(11,13,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.cap{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.4px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;transition:.2s;z-index:20;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#setup{max-width:440px;margin:0 auto;padding:40px 20px;display:flex;flex-direction:column;gap:14px}
svg text{font-family:Inter,system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section id="setup" hidden>
  <h1>Kalshi Bot</h1>
  <p class="muted" style="margin:0">Connect with a GitHub token that can read and run this repository's Actions. It stays on this phone.</p>
  <label class="field">GitHub token<input id="tokenIn" type="password" autocomplete="off" placeholder="github_pat_..."></label>
  <label class="field">Repository<input id="repoIn" value="dtmiescke/kalshi-bot" autocapitalize="off"></label>
  <div style="display:flex;gap:8px"><button class="btn primary" id="connectBtn" style="flex:1">Connect</button><button class="btn" id="demoBtn" style="flex:1">Look around first</button></div>
</section>
<main id="screen" class="wrap" hidden></main>
<nav id="tabs" hidden aria-label="Sections">
  <button data-tab="dash"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
  <button data-tab="crypto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>Crypto</button>
  <button data-tab="sports"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Sports</button>
  <button data-tab="activity"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Activity</button>
  <button data-tab="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</nav>
<div id="sheetRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const BOT_WF="bot.yml", TRAIN_WF="train.yml", DATA_BRANCH="bot-data";
// Read-only Kalshi relay (realtime/kalshi-feed): live ticker WebSocket + /api/* REST passthrough.
const FEED_DEFAULT="https://kalshi-readonly-feed.dtmiescke93.workers.dev";
const COINS=[
  {sym:"BTC",name:"Bitcoin",series:"KXBTC15M",cb:"BTC-USD",dp:0},
  {sym:"ETH",name:"Ethereum",series:"KXETH15M",cb:"ETH-USD",dp:2},
  {sym:"SOL",name:"Solana",series:"KXSOL15M",cb:"SOL-USD",dp:2},
  {sym:"BNB",name:"BNB",series:"KXBNB15M",kraken:"BNBUSD",dp:2},
];
// Each coin's ladder series ("price on <date>?"): swiped to after the 15-minute chart.
const LADDER={BTC:"KXBTCD",ETH:"KXETHD",SOL:"KXSOLD",BNB:"KXBNBD"};
const SETTINGS=[
  {name:"FIXED_BET",label:"Fixed bet ($, blank = auto sizing)",type:"number"},
  {name:"MIN_EDGE",label:"Minimum edge on sports (%)",type:"number",def:"3",pct:true},
  {name:"CRYPTO_MIN_EDGE",label:"Minimum edge on 15-min crypto (%)",type:"number",def:"5",pct:true},
  {name:"LADDERS_ENABLED",label:"Hourly and daily crypto ladders",type:"select",opts:["yes","no"],def:"yes"},
  {name:"ORDER_STYLE",label:"Order style",type:"select",opts:["maker","taker"],def:"maker"},
  {name:"COUNCIL_MODE",label:"AI review",type:"select",opts:["advisory","required","off"],def:"advisory"},
  {name:"LLM_DAILY_LIMIT",label:"AI calls per day",type:"number",def:"45"},
  {name:"SPORTS_MODE",label:"Sports to research",type:"select",opts:["all","manual"],def:"all"},
  {name:"SPORTS_SELECTED",label:"Sports list when manual (like KXNFLGAME,KXNBAGAME)",type:"text"},
  {name:"BOT_TIMEZONE",label:"Time zone for daily limits",type:"text",def:"America/Chicago"},
];
const $=id=>document.getElementById(id);
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
let cfg=null;try{cfg=JSON.parse(localStorage.getItem("kbot")||"null")}catch(e){}
let demo=false, vars={}, wfState=null, runsCache=[], bets=[], sample=false, briefing="", report="";
let account=null, council=[], model=null, lessons=[], audit=[], combos=[], dbNote="", summaryKV={}, members={}, storage=null, liveSnap=null;

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2800)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(x){return (x<0?"−$":"$")+Math.abs(x).toFixed(2)}
function smoney(x){return (x>=0?"+$":"−$")+Math.abs(x).toFixed(2)}
function cls(x){return x>0?"up":x<0?"down":""}
function pct(x){return x==null?"–":Math.round(x*100)+"%"}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";return Math.floor(s/86400)+" d ago"}
function hm(ts){return new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function when(ts){const d=new Date(ts),t=new Date();const same=d.toDateString()===t.toDateString();return (same?"Today ":d.toLocaleDateString([],{weekday:"short"})+" ")+hm(ts)}
const CHEV='<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const BACK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';

/* ================= GitHub ================= */
async function gh(path,opts={}){
  if(demo) throw Object.assign(new Error("Connect a token to do this."),{status:0,demo:true});
  const res=await fetch("https://api.github.com/repos/"+cfg.repo+path,{...opts,headers:{"Authorization":"Bearer "+cfg.token,
    "Accept":(opts.raw||opts.bin)?"application/vnd.github.raw":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",
    ...(opts.body?{"Content-Type":"application/json"}:{})}});
  if(!res.ok){let m=res.status+"";try{m=(await res.json()).message||m}catch(e){}throw Object.assign(new Error(m),{status:res.status})}
  if(res.status===204)return null;
  if(opts.bin)return res.arrayBuffer();
  return opts.raw?res.text():res.json();
}
function explain(e){
  if(e.demo)return "Look-around mode. Connect your token in Settings to do this.";
  if(e.status===401)return "Token rejected. Disconnect and paste it again.";
  if(e.status===403)return "Token is missing a permission: "+e.message;
  if(e.status===404)return "Not found. Check the repo name and the token’s repo access.";
  if(e.status===422)return "GitHub refused: "+e.message;
  return "Couldn’t reach GitHub: "+e.message;
}
async function file(path){try{return await gh("/contents/"+path+"?ref="+DATA_BRANCH,{raw:true})}catch(e){if(e.status===404||e.demo)return null;throw e}}
async function gunzip(buf){
  if(typeof DecompressionStream==="undefined")throw new Error("This browser cannot decompress the saved database. Update Chrome and try again.");
  const stream=new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).arrayBuffer();
}

/* ================= bets (bets.csv on bot-data) ================= */
function parseCSV(t){const rows=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;else if(ch==','){row.push(c);c=""}else if(ch=='\n'){row.push(c);rows.push(row);row=[];c=""}else if(ch!='\r')c+=ch}
  if(c||row.length){row.push(c);rows.push(row)}return rows.filter(r=>r.some(x=>x!==""))}
function coinOf(series){const m=String(series||"").match(/^KX(BTC|ETH|SOL|BNB)/);return m?m[1]:null}
function leagueOf(s){s=String(s||"").toUpperCase();
  if(/WNBA/.test(s))return"WNBA";if(/NFL/.test(s))return"NFL";if(/NBA/.test(s))return"NBA";if(/NHL/.test(s))return"NHL";if(/MLB/.test(s))return"MLB";
  if(/NCAAF|CFB/.test(s))return"CFB";if(/NCAAB|CBB/.test(s))return"CBB";if(/MLS|EPL|UCL|SOCCER|LALIGA|SERIEA/.test(s))return"Soccer";if(/UFC|MMA/.test(s))return"UFC";return"Other"}
function isProp(series,ticker){return /(PTS|REB|AST|PASS|RUSH|REC|TD|GOAL|SOG|HR|HIT|STRIKEOUT|KS|PROP|PLAYER|3PT|YDS)/.test(String(series||"")+" "+String(ticker||"").split("-")[0])}
function parseSignals(v){ // "name:prob:conf;..." (export_csv) or JSON
  if(!v)return[];try{if(v.trim().startsWith("{")){const o=JSON.parse(v);return Object.entries(o).map(([n,x])=>({name:n,p:+(x.p??x.prob),c:+(x.c??x.confidence)})).filter(x=>isFinite(x.p))}}catch(e){}
  return v.split(";").map(s=>s.split(":")).filter(a=>a.length>=2&&isFinite(+a[1])).map(a=>({name:a[0],p:+a[1],c:a[2]!=null?+a[2]:null}));
}
function toBets(rows){
  // Column names are matched loosely so a dashboard.py change can't blank the app.
  if(rows.length<2)return[];const h=rows[0].map(x=>x.trim().toLowerCase());
  const pick=(o,names)=>{for(const n of names){if(o[n]!=null&&o[n]!=="")return o[n]}return null};
  const num=v=>{const x=parseFloat(v);return isNaN(x)?null:x};
  const tms=v=>{if(v==null)return 0;const x=Number(v);if(!isNaN(x))return x>1e12?x:x*1000;const d=Date.parse(v);return isNaN(d)?0:d};
  const mode=(vars.BOT_MODE||"paper").toLowerCase();
  let out=rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]);
    const status=(pick(o,["status"])||"").toLowerCase(),pnl=num(pick(o,["pnl","realized_pnl","net_pnl","profit"]));
    const series=pick(o,["series","series_ticker"])||"",ticker=pick(o,["ticker","market"])||"";
    return{id:pick(o,["id","bet_id"]),ts:tms(pick(o,["ts","opened_ts","created_ts","placed_ts","time_utc","opened_at","created_at"])),
      exitTs:tms(pick(o,["exit_ts","graded_ts"])),ticker,series,team:pick(o,["team"])||"",side:(pick(o,["side"])||"").toUpperCase(),
      price:num(pick(o,["price","entry_price","avg_price"])),contracts:num(pick(o,["contracts","filled","count","quantity"])),
      stake:num(pick(o,["stake","cost","total_cost"])),fee:num(pick(o,["fee"])),prob:num(pick(o,["model_prob","prob","probability"])),
      edge:num(pick(o,["edge"])),conf:num(pick(o,["confidence"])),style:pick(o,["style","order_style"])||"",status,
      result:(pick(o,["result","outcome"])||"").toLowerCase(),closing:num(pick(o,["closing_price"])),exit:num(pick(o,["exit_price"])),clv:num(pick(o,["clv"])),
      pnl:status==="open"?null:pnl,mode:(pick(o,["mode","account_mode"])||"").toLowerCase(),signals:parseSignals(pick(o,["signals","signals_json"])||""),
      coin:coinOf(series),league:coinOf(series)?null:leagueOf(series),prop:!coinOf(series)&&isProp(series,ticker)}});
  if(out.some(b=>b.mode))out=out.filter(b=>!b.mode||b.mode===mode);   // only the mode you're in
  return out.sort((a,b)=>b.ts-a.ts);
}
function sampleBets(){
  const now=Date.now(),list=[];let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const mk=["KXBTC15M","KXETH15M","KXSOL15M","KXBNB15M","KXBTC15M","KXETH15M","KXNBAGAME","KXNFLGAME","KXNBAPTS","KXNHLGOAL"];
  for(let i=0;i<46;i++){const s=mk[Math.floor(rnd()*mk.length)],price=+(0.32+rnd()*0.36).toFixed(2),edge=+(0.03+rnd()*0.07).toFixed(3),open=i<2,win=rnd()<0.57,c=Math.ceil(10+rnd()*30);
    const ts=now-i*97*60000-Math.floor(rnd()*600000),side=rnd()<.7?"YES":"NO",p=+(price+edge).toFixed(3);
    const team=coinOf(s)?"":["Denver","Boston","Detroit","Buffalo","Toronto","Miami","Dallas"][i%7];
    list.push({id:"s"+i,ts,exitTs:open?0:ts+15*60000,ticker:s+"-26OCT28-"+(15*(i%4)),series:s,team,side,price,contracts:c,stake:+(price*c).toFixed(2),fee:0,prob:p,edge,conf:+(0.5+rnd()*0.4).toFixed(2),
      style:"maker",status:open?"open":"graded",result:open?"":(win?side.toLowerCase():(side==="YES"?"no":"yes")),closing:null,exit:null,clv:null,
      pnl:open?null:+(win?(1-price)*c:-price*c).toFixed(2),mode:"paper",
      signals:[{name:"crypto_model",p,c:.75},{name:"crypto_model_iv",p:p-.02,c:.6},{name:"crypto_orderbook",p:p-.04,c:.3},{name:"crypto_momentum",p:p-.03,c:.2},{name:"kalshi_market",p:price,c:.9}],
      coin:coinOf(s),league:coinOf(s)?null:leagueOf(s),prop:!coinOf(s)&&isProp(s,"")})}
  return list.sort((a,b)=>b.ts-a.ts);
}
function graded(list){return list.filter(b=>b.pnl!=null)}
function statsOf(list){
  const g=graded(list),tot=g.reduce((a,b)=>a+b.pnl,0),w=g.filter(b=>b.pnl>0).length,staked=g.reduce((a,b)=>a+(b.stake||0),0);
  const side=s=>{const x=g.filter(b=>b.side===s);return x.length?x.filter(b=>b.pnl>0).length/x.length:null};
  const edges=list.filter(b=>b.edge!=null);
  return{total:tot,win:g.length?w/g.length:null,settled:g.length,won:w,count:list.length,open:list.filter(b=>b.status==="open"),
    roi:staked?tot/staked:null,avgEdge:edges.length?edges.reduce((a,b)=>a+b.edge,0)/edges.length:null,
    best:g.length?Math.max(...g.map(b=>b.pnl)):null,yes:side("YES"),no:side("NO")};
}
function dayPnl(list,days=7){
  const out=[],g=graded(list);for(let i=days-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const e=d.getTime()+86400000;
    out.push({label:d.toLocaleDateString([],{weekday:"short"}),v:g.filter(b=>(b.exitTs||b.ts)>=d.getTime()&&(b.exitTs||b.ts)<e).reduce((a,b)=>a+b.pnl,0)})}
  return out;
}
function label(b){if(b.coin){return b.coin+(/15M/.test(b.series)?" 15-min":" ladder")}return b.team||b.league||b.series}
function betTitle(b){
  if(b.coin){const m=String(b.ticker).match(/-T?([0-9.]+)$/);const strike=m&&+m[1]>50?"$"+(+m[1]).toLocaleString():"";
    return b.coin+(strike?" above "+strike:" 15-min")+" · "+b.side}
  const tail=String(b.ticker||"").split("-").pop();
  return (b.team||tail||b.league)+" · "+(b.prop?"Prop":"Game")+" · "+b.side;
}

/* ================= saved bot data (summary.json first, database fallback) ================= */
function loadScript(src){return new Promise((ok,bad)=>{const t=document.createElement("script");t.src=src;t.onload=ok;t.onerror=()=>bad(new Error("couldn’t load "+src));document.head.appendChild(t)})}
let SQLlib=null;
async function loadDB(){
  if(demo)return;
  let list;try{list=await gh("/contents/?ref="+DATA_BRANCH)}catch(e){dbNote=e.status===404?"No saved bot data yet.":explain(e);return}
  // Small summary the bot writes on every save: no database download needed.
  const sf=(list||[]).find(x=>x.name==="summary.json");
  if(sf){
    if(sf.sha===loadDB.sha)return;
    try{const s=JSON.parse(await file("summary.json"));
      council=s.council||[];model=s.model||null;lessons=s.lessons||[];audit=s.audit||[];combos=s.combos||[];storage=s.storage||null;
      summaryKV=s.kv||{};members=s.members||{};account=s.account||null;loadDB.sha=sf.sha;dbNote="";return}
    catch(e){/* fall back to the full database below */}
  }
  const f=(list||[]).find(x=>x.name==="bot.sqlite.gz")||(list||[]).find(x=>x.name==="bot.sqlite");
  if(!f){dbNote="No bot database saved yet.";return}
  if(f.sha===loadDB.sha)return;
  if(f.size>45e6){dbNote="Saved bot database is too large to fetch on a phone ("+Math.round(f.size/1e6)+" MB).";return}
  try{
    if(!SQLlib){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js");
      SQLlib=await initSqlJs({locateFile:n=>"https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/"+n})}
    const compressed=f.name==="bot.sqlite.gz";
    const buf=await gh("/contents/"+encodeURIComponent(f.name)+"?ref="+DATA_BRANCH,{bin:true});
    const dbBytes=compressed?await gunzip(buf):buf;
    if(dbBytes.byteLength>100e6){dbNote="Decompressed bot database is too large for a phone ("+Math.round(dbBytes.byteLength/1e6)+" MB).";return}
    const db=new SQLlib.Database(new Uint8Array(dbBytes));
    const q=(sql)=>{try{const r=db.exec(sql);if(!r.length)return[];const{columns,values}=r[0];return values.map(v=>Object.fromEntries(columns.map((c,i)=>[c,v[i]])))}catch(e){return[]}};
    const m=q("SELECT * FROM model_runs ORDER BY ts DESC LIMIT 1")[0];
    if(m){let mt={};try{mt=JSON.parse(m.metrics)}catch(e){}model={ts:m.ts*1000,promoted:!!m.promoted,status:mt.status,conf:mt.bootstrap_confidence,windows:mt.test_windows||mt.n_test}}
    lessons=q("SELECT ts,text FROM lessons ORDER BY ts DESC LIMIT 5");
    db.close();loadDB.sha=f.sha;dbNote="";
  }catch(e){dbNote="Couldn’t open the bot database: "+e.message}
}

/* ================= live Kalshi markets (relay) + spot prices ================= */
const feedBase=()=>(vars.APP_FEED_URL||FEED_DEFAULT).replace(/\/$/,"");
// key -> {market, ticker, strike, close, open, pts:[{t,p}], spot, spotTs, err}. The 15-minute
// market's key is the coin ("BTC"); ladder markets are "BTC:<ticker>", listed in ladders[sym].
const live={},ladders={},ladderAt={},slideAt={};
COINS.forEach(c=>live[c.sym]={pts:[],series:c.series,kind:"15m"});
const coinFor=k=>COINS.find(c=>c.sym===k.split(":")[0]);
const slideKeys=sym=>[sym,...(ladders[sym]||[]).filter(k=>live[k])];
const activeKey=sym=>{const ks=slideKeys(sym);return ks[Math.min(slideAt[sym]||0,ks.length-1)]};
const heldBet=k=>live[k]&&live[k].ticker&&bets.find(b=>b.status==="open"&&b.ticker===live[k].ticker);
function dollars(v){const n=parseFloat(v);return isFinite(n)?n:null}
function midOf(m){const b=dollars(m.yes_bid_dollars),a=dollars(m.yes_ask_dollars),l=dollars(m.last_price_dollars);
  if(b!=null&&a!=null&&a>0)return (b+a)/2;return l}
async function feedJSON(path){const r=await fetch(feedBase()+path,{cache:"no-store"});if(!r.ok)throw new Error("relay "+r.status);return r.json()}
async function discover(c){
  const L=live[c.sym];
  try{
    const d=await feedJSON("/api/markets?series_ticker="+c.series+"&status=open&limit=10");
    const now=Date.now(),ms=(d.markets||[]).filter(m=>Date.parse(m.close_time)>now).sort((a,b)=>Date.parse(a.close_time)-Date.parse(b.close_time));
    const m=ms[0];if(!m){L.err="No open market right now";return}
    const changed=L.ticker!==m.ticker;
    Object.assign(L,{market:m,ticker:m.ticker,strike:m.floor_strike??m.cap_strike,close:Date.parse(m.close_time),open:Date.parse(m.open_time),err:null});
    const mid=midOf(m);
    if(changed){L.pts=[];L.histTries=0;await loadHistory(c.sym)}
    if(mid!=null)push(c.sym,mid);
    if(changed)subscribe();
  }catch(e){L.err="Live market data unavailable ("+e.message+")"}
}
async function discoverLadder(c){ // next two ladder closes; per close the strike the bot holds, else the closest to 50%
  const series=LADDER[c.sym];if(!series)return;ladderAt[c.sym]=Date.now();
  try{
    const d=await feedJSON("/api/ladder?series_ticker="+series),old=ladders[c.sym]||[],keys=[],dist=m=>Math.abs((midOf(m)??.5)-.5);
    for(const g of (d.closes||[]).filter(g=>Date.parse(g.close_time)>Date.now()).slice(0,2)){
      const ms=g.markets||[];if(!ms.length)continue;
      const prev=old.map(k=>live[k]).find(L=>L&&L.market&&L.market.close_time===g.close_time);
      const m=ms.find(m=>bets.some(b=>b.status==="open"&&b.ticker===m.ticker))||ms.find(m=>prev&&m.ticker===prev.ticker&&dist(m)<.35)||ms.slice().sort((a,b)=>dist(a)-dist(b))[0];
      const key=c.sym+":"+m.ticker,L=live[key]||(live[key]={pts:[],series,kind:"ladder"});keys.push(key);
      Object.assign(L,{market:m,ticker:m.ticker,strike:m.floor_strike??m.cap_strike,strikeType:m.strike_type,close:Date.parse(m.close_time),open:Date.parse(m.open_time),err:null});
      if(!L.pts.length){L.histTries=0;await loadHistory(key)}
      push(key,midOf(m));
    }
    old.filter(k=>!keys.includes(k)).forEach(k=>delete live[k]);
    ladders[c.sym]=keys;
    if(keys.join()!==old.join()){subscribe();if((route.page==="coin"&&route.sym===c.sym)||(route.page==="main"&&route.tab==="dash"&&ui.feat===c.sym))render()}
  }catch(e){}
}
async function loadHistory(key){
  const L=live[key];if(!L||!L.ticker)return;
  const end=Math.floor(Date.now()/1000),start=Math.max(Math.floor((L.open||Date.now()-900000)/1000)-60,end-6*3600);
  try{const d=await feedJSON("/api/candles?series_ticker="+L.series+"&ticker="+encodeURIComponent(L.ticker)+"&start_ts="+start+"&end_ts="+end+"&period_interval=1");
    const live=L.pts.filter(p=>p.t>end*1000-5000);
    L.pts=(d.candlesticks||[]).map(k=>{const p=k.price||{},yb=k.yes_bid||{},ya=k.yes_ask||{};
      const v=dollars(p.close_dollars)??((dollars(yb.close_dollars)!=null&&dollars(ya.close_dollars)!=null)?(dollars(yb.close_dollars)+dollars(ya.close_dollars))/2:null);
      return v==null?null:{t:k.end_period_ts*1000,p:v}}).filter(Boolean).concat(live);
  }catch(e){ // chart starts from live ticks; try the history again shortly
    L.histTries=(L.histTries||0)+1;if(L.histTries<4)setTimeout(()=>loadHistory(key).then(scheduleLive),3000*L.histTries);
  }
}
function push(k,p,t=Date.now()){if(!live[k])return;const pts=live[k].pts;if(p==null||!isFinite(p))return;
  if(pts.length&&t-pts[pts.length-1].t<2000)pts[pts.length-1]={t,p};else pts.push({t,p});if(pts.length>600)pts.shift()}
let ws=null,wsTimer=null,wsOK=false;
function connectWS(){
  try{ws=new WebSocket(feedBase().replace(/^http/,"ws")+"/ws")}catch(e){return}
  ws.onopen=()=>{wsOK=true;subscribe()};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.type!=="ticker"||!m.msg)return;const t=m.msg.market_ticker;const k=Object.keys(live).find(k=>live[k].ticker===t);if(!k)return;const L=live[k];
    const b=m.msg.yes_bid_dollars!=null?dollars(m.msg.yes_bid_dollars):(m.msg.yes_bid!=null?m.msg.yes_bid/100:null);
    const a=m.msg.yes_ask_dollars!=null?dollars(m.msg.yes_ask_dollars):(m.msg.yes_ask!=null?m.msg.yes_ask/100:null);
    const p=(b!=null&&a!=null&&a>0)?(b+a)/2:(m.msg.price_dollars!=null?dollars(m.msg.price_dollars):(m.msg.price!=null?m.msg.price/100:null));
    if(b!=null&&L.market){L.market.yes_bid_dollars=String(b);L.market.no_ask_dollars=String(1-b)}
    if(a!=null&&L.market)L.market.yes_ask_dollars=String(a);
    push(k,p);scheduleLive()};
  ws.onclose=()=>{wsOK=false;clearTimeout(wsTimer);wsTimer=setTimeout(connectWS,5000)};
  ws.onerror=()=>{try{ws.close()}catch(e){}};
}
function subscribe(){if(!ws||ws.readyState!==1)return;const t=[...new Set(Object.values(live).map(L=>L.ticker).filter(Boolean))];if(!t.length)return;
  ws.send(JSON.stringify({id:Date.now()%100000,cmd:"subscribe",params:{channels:["ticker"],market_tickers:t}}))}
async function spot(c){
  try{
    if(c.cb){const r=await fetch("https://api.exchange.coinbase.com/products/"+c.cb+"/ticker");const d=await r.json();live[c.sym].spot=+d.price}
    else{const r=await fetch("https://api.kraken.com/0/public/Ticker?pair="+c.kraken);const d=await r.json();live[c.sym].spot=+Object.values(d.result||{})[0].c[0]}
    live[c.sym].spotTs=Date.now();

function botModel(k){ // the bot's latest blended probability for this market (LIVE.json; 15-minute markets)
  const L=live[k],d=liveSnap;if(!L||!d||!d.markets)return null;
  const m=L.ticker&&d.markets[L.ticker];const x=m&&m.model;if(!x||x.prob==null)return null;

let liveTimer=null;
function scheduleLive(){if(liveTimer)return;liveTimer=setTimeout(()=>{liveTimer=null;updateLive()},REDUCED?1500:400)}
async function pollMarkets(){if(document.visibilityState!=="visible")return;
  for(const c of COINS){const L=live[c.sym];   // one at a time: Kalshi rate-limits bursts
    if(!L.ticker||!L.close||Date.now()>L.close-1000)await discover(c);
    else if(!wsOK)await feedJSON("/api/market?ticker="+encodeURIComponent(L.ticker)).then(d=>{if(d.market){L.market=d.market;push(c.sym,midOf(d.market))}}).catch(()=>{});
  }

    if(!ladderAt[c.sym]||Date.now()-ladderAt[c.sym]>(wsOK?300000:30000)||ks.some(k=>live[k]&&Date.now()>live[k].close-1000))await discoverLadder(c)}
  scheduleLive()}

/* ================= charts (inline SVG) ================= */
function chanceSVG(pts,w,h,o={}){
  w=Math.max(200,Math.round(w));const right=34,plotW=w-right,top=10,bot=h-20;
  if(!pts.length)return`<svg width="${w}" height="${h}" role="img" aria-label="No price data yet"><text x="${plotW/2}" y="${h/2}" text-anchor="middle" font-size="12" fill="var(--muted)">Waiting for prices…</text></svg>`;
  const t0=o.from??pts[0].t,t1=Math.max(o.to??Date.now(),pts[pts.length-1].t,t0+60000);
  const vals=pts.map(p=>p.p).concat(o.model!=null?[o.model]:[]).concat(o.entry!=null?[o.entry]:[]);
  let lo=Math.max(0,Math.floor((Math.min(...vals)*100-4)/10)*10),hi=Math.min(100,Math.ceil((Math.max(...vals)*100+4)/10)*10);if(hi-lo<20){hi=Math.min(100,lo+20)}
  const x=t=>((t-t0)/(t1-t0))*plotW,y=v=>top+(1-(v*100-lo)/(hi-lo))*(bot-top);
  const line=pts.map(p=>x(p.t).toFixed(1)+","+y(p.p).toFixed(1)).join(" ");
  const last=pts[pts.length-1],lx=x(last.t),ly=y(last.p);
  const grid=[0,1,2,3].map(i=>{const gy=top+i*(bot-top)/3,lab=Math.round(hi-i*(hi-lo)/3);return`<line x1="0" y1="${gy.toFixed(1)}" x2="${plotW}" y2="${gy.toFixed(1)}" stroke="var(--line2)"/><text x="${plotW+6}" y="${(gy+4).toFixed(1)}" font-size="11" fill="var(--muted2)">${lab}%</text>`}).join("");
  const times=[t0,(t0+t1)/2,t1].map((t,i)=>`<text x="${i===0?0:i===1?plotW/2:plotW}" y="${h-4}" font-size="11" fill="var(--muted2)" text-anchor="${i===0?"start":i===1?"middle":"end"}">${i===2&&!o.to?"Now":hm(t)}</text>`).join("");
  const model=o.model!=null?`<line x1="0" y1="${y(o.model).toFixed(1)}" x2="${plotW}" y2="${y(o.model).toFixed(1)}" stroke="var(--text)" stroke-width="1.4" stroke-dasharray="4 3"/>`:"";
  const entry=o.entry!=null?`<line x1="${o.entryT!=null?Math.max(0,x(o.entryT)).toFixed(1):0}" y1="${y(o.entry).toFixed(1)}" x2="${plotW}" y2="${y(o.entry).toFixed(1)}" stroke="var(--orange)" stroke-width="1.4" stroke-dasharray="5 3"/>`:"";
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Chance chart, now ${Math.round(last.p*100)}%">${grid}${model}${entry}
    <path d="M${x(pts[0].t).toFixed(1)},${bot} L${line.replace(/ /g," L")} L${lx.toFixed(1)},${bot} Z" fill="var(--blue)" fill-opacity="0.08"/>
    <polyline fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linejoin="round" points="${line}"/>
    ${o.to?"":`<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="8" fill="var(--blue)" fill-opacity="0.18"/>`}<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="var(--blue)"/>${times}</svg>`;
}
function lineSVG(vals,w,h,color="var(--blue)",zero=false){
  w=Math.max(60,Math.round(w));if(vals.length<2)return zero?`<p class="empty" style="padding:28px 0">No settled bets in this range.</p>`:`<svg width="${w}" height="${h}" aria-hidden="true"></svg>`;

      <div class="legend"><div class="keys"><span><i class="sw"></i>YES price</span>${entryYes!=null?`<span><i class="sw entry"></i>Your entry (YES ${Math.round(entryYes*100)}¢)</span>`:""}</div></div></section>`+
    `<section class="grid3">${facts.map(f=>`<div class="tile"><small>${f[0]}</small><b class="num">${esc(f[1])}</b></div>`).join("")}</section>`+
    `<section class="card"><h2>Why the bot took it</h2>
      <div class="kv"><span>Edge at entry</span><b class="num">${b.edge!=null?"+"+(b.edge*100).toFixed(1)+" pts":"–"}</b></div>
      <div class="kv"><span>Confidence</span><b class="num">${b.conf!=null?pct(b.conf):"–"}</b></div>
      <div class="kv"><span>Order style</span><b>${esc(b.style||"–")}</b></div>
      ${b.closing!=null?`<div class="kv"><span>Closing price</span><b class="num">${Math.round(b.closing*100)}¢${b.clv!=null?" · CLV "+(b.clv>=0?"+":"−")+Math.abs(b.clv*100).toFixed(1):""}</b></div>`:""}
      ${sig.length?`<div class="cap" style="margin-top:6px">SIGNALS (CHANCE OF YES)</div>${sig.map(s=>`<div class="meter"><span>${esc(SIGNAL_NAMES[s.name]||s.name)}</span><span class="track"><i style="width:${Math.round(s.p*100)}%"></i></span><b class="num">${Math.round(s.p*100)}%</b></div>`).join("")}`:""}
    </section>`;
}
function screenSettings(){
  const on=wfState==="active";
  return header("Settings")+
    `<section class="card" style="gap:0"><button class="switch" data-act="power"><span class="rowmain"><b>Bot ${wfState?(on?"running":"paused"):"not connected"}</b><small>${wfState?(on?"Runs on its own schedule. Tap to pause.":"Won’t run or bet. Tap to resume."):"Connect a token to control the bot."}</small></span><span class="tog ${on?"on":""}"><i></i></span></button>
      <div class="kv"><span>Mode</span><b>${esc((vars.BOT_MODE||"paper").replace(/^./,c=>c.toUpperCase()))} (locked)</b></div></section>`+
    betCard()+
    `<div style="display:flex;gap:8px"><button class="btn primary" style="flex:1" data-act="run">Run now</button><button class="btn" style="flex:1" data-act="train">Retrain model</button></div>`+
    `<section class="card list"><div class="cardhead"><h2>Recent runs</h2></div>${runsCache.map(r=>{const lv=r.status!=="completed",word=lv?(r.status==="queued"?"Queued":"Running"):({success:"Done",failure:"Failed",cancelled:"Stopped"}[r.conclusion]||r.conclusion);
      return`<div class="row" style="min-height:52px"><span class="dot ${!lv&&r.conclusion==="failure"?"off":""}"></span><span class="rowmain"><b><a href="${esc(r.html_url)}" target="_blank" rel="noopener" style="color:inherit">${esc(r.name)} #${r.run_number}</a></b><small>${word} · ${ago(Date.parse(r.created_at))}</small></span>${lv?`<button class="btn small" data-act="stop" data-v="${r.id}">Stop</button>`:""}</div>`}).join("")||`<p class="empty">${demo?"Connect a token to see runs.":"No runs yet."}</p>`}</section>`+
    `<section class="card"><h2>More settings</h2>${SETTINGS.map(s=>{let val=vars[s.name]??"";if(s.pct&&val!==""&&+val<=1)val=String(+(+val*100).toFixed(4));
      if(s.type==="select"){const cur=val||s.def;return`<label class="field">${s.label}<select data-var="${s.name}">${s.opts.map(o=>`<option${o===cur?" selected":""}>${o}</option>`).join("")}</select></label>`}
      return`<label class="field">${s.label}<input data-var="${s.name}" ${s.type==="text"?'type="text" autocapitalize="off"':'type="number" inputmode="decimal" step="any"'} value="${esc(val)}" placeholder="${s.def?"Default "+s.def:"Off"}"></label>`}).join("")}
      <button class="btn primary" data-act="saveVars">Save settings</button></section>`+
    `<section class="card"><h2>AI briefing</h2><pre>${esc(briefing||"No briefing yet.")}</pre></section>`+
    `<section class="card"><h2>Performance report</h2><pre>${esc(report||"No report yet.")}</pre></section>`+
    (dbNote?`<p class="note">${esc(dbNote)}</p>`:"")+
    `<button class="btn" data-act="logout">${demo?"Connect a token":"Disconnect this phone"}</button>`;
}
// Bet settings: the APP_* repository variables the bot workflow reads (defaults in bot.yml).
const BET_FIELDS=[
  {name:"APP_BANKROLL",label:"Bankroll ($)",def:500,acct:"bankroll",min:1},
  {name:"APP_MIN_BET",label:"Smallest bet ($)",def:5,acct:"min_per_bet",min:1},
  {name:"APP_MAX_BET",label:"Biggest bet ($)",def:20,acct:"max_per_bet",min:1},
  {name:"APP_BETS_PER_HOUR",label:"Most crypto bets per hour",hint:"16 = all 4 coins every 15 minutes",def:16,acct:"crypto_max_trades_per_hour",min:0,max:60,int:true},
  {name:"APP_MAX_OPEN_COST",label:"Most money in open bets ($)",def:160,acct:"max_open_cost",min:1},
  {name:"APP_STOP_LOSS",label:"Stop betting after losing ($)",def:500,acct:"max_total_loss",min:1},
];
const STYLES=[["conservative","Careful"],["balanced","Balanced"],["aggressive","Aggressive"],["adaptive","Adaptive"],["off","Strict (no boost)"]];
function betValue(f){const v=vars[f.name];if(v!=null&&v!=="")return String(v);const a=account&&account[f.acct];return String(a!=null?+a:f.def)}
function betCard(){
  const style=vars.APP_STYLE||(account&&account.aggression_level)||"aggressive",since=account&&account.stats_since;
  return`<section class="card" id="betcard"><div class="cardhead"><h2>Bet settings</h2><span class="pill">Paper</span></div>
    ${BET_FIELDS.map(f=>{const v=betValue(f);return`<label class="field">${f.label}<input data-bet="${f.name}" data-orig="${esc(v)}" type="number" inputmode="${f.int?"numeric":"decimal"}" step="${f.int?1:"any"}" min="${f.min}"${f.max?` max="${f.max}"`:""} value="${esc(v)}">${f.hint?`<small class="note">${f.hint}</small>`:""}</label>`}).join("")}
    <label class="field">Style<select data-bet="APP_STYLE" data-orig="${esc(style)}">${STYLES.map(([v,l])=>`<option value="${v}"${v===style?" selected":""}>${l}</option>`).join("")}</select></label>
    <button class="btn primary" data-act="saveBets">Save bet settings</button>
    <div class="kv" style="border-top:1px solid var(--line2);margin-top:4px"><span>Stats since</span><b class="num">${since?when(since*1000):"The start"}</b></div>
    <button class="btn" data-act="resetStats">Restart stats from now</button>
    <small class="note">Changes apply from the bot’s next run (within about 15 minutes). Restarting stats clears P/L, balance and win rate; everything the bot learned is kept.</small>
  </section>`}
function betErrors(v){const n=k=>+v[k],e=[];
  for(const f of BET_FIELDS){const x=n(f.name);if(!isFinite(x)||x<f.min||(f.max!=null&&x>f.max)||(f.int&&!Number.isInteger(x)))e.push(f.label.replace(/ \(\$\)/,"")+": enter "+(f.int?"a whole number":"an amount")+" of at least "+f.min+(f.max!=null?" and at most "+f.max:""))}
  if(!e.length){
    if(n("APP_MIN_BET")>n("APP_MAX_BET"))e.push("Smallest bet can’t be more than the biggest bet");
    if(n("APP_MAX_BET")>n("APP_BANKROLL"))e.push("Biggest bet can’t be more than the bankroll");
    if(n("APP_MAX_OPEN_COST")<n("APP_MAX_BET"))e.push("Money in open bets must allow at least one biggest bet");
  }
  return e}
async function saveBets(btn){
  const els=[...document.querySelectorAll("[data-bet]")],v={};els.forEach(el=>v[el.dataset.bet]=el.value.trim());
  const errs=betErrors(v);if(errs.length){toast(errs[0]);return}
  btn.disabled=true;let n=0;
  try{for(const el of els){const val=v[el.dataset.bet];if(val===el.dataset.orig)continue;await setVar(el.dataset.bet,val);el.dataset.orig=val;n++}
    toast(n?"Saved. The bot uses it from its next run.":"Nothing changed")}catch(e){toast(explain(e))}btn.disabled=false}
async function resetStats(btn){
  if(!confirm("Restart P/L, balance and win rate from now?\n\nPast bets stay in the bot’s memory, so nothing it learned is lost."))return;
  btn.disabled=true;
  try{const now=new Date().toISOString().slice(0,19)+"Z";await setVar("APP_STATS_SINCE",now);toast("Stats restart from now. The app shows it after the bot’s next save.")}
  catch(e){toast(explain(e))}btn.disabled=false}
function customizeSheet(){
  const leagues=[...new Set(bets.filter(b=>!b.coin).map(b=>b.league))].sort();
  return`<div class="sheetbg" data-act="closeSheet"><div class="sheet" role="dialog" aria-label="Customize sports" data-stop="1">
    <div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:18px">Customize sports</h1><button class="btn primary small" data-act="closeSheet">Done</button></div>
    <span class="cap">BET TYPES</span>${[["game","Game bets"],["prop","Player prop bets"]].map(t=>`<button class="switch" data-act="toggleType" data-v="${t[0]}" style="border:1px solid var(--line);border-radius:12px;padding:0 14px"><b>${t[1]}</b><span class="tog ${custom.types[t[0]]!==false?"on":""}"><i></i></span></button>`).join("")}
    <span class="cap">LEAGUES</span><div class="leagues">${leagues.length?leagues.map(l=>`<button class="lg" data-act="toggleLeague" data-v="${esc(l)}" aria-pressed="${custom.leagues[l]!==false}">${custom.leagues[l]!==false?"✓ ":""}${esc(l)}</button>`).join(""):'<span class="note">Leagues appear once the bot bets on them.</span>'}</div>
  </div></div>`}

/* ================= render + live updates ================= */
let sheetOpen=false;
function render(scrollTop){
  const s=$("screen");
  const map={main:{dash:screenDash,crypto:screenCrypto,sports:screenSports,activity:screenActivity,settings:screenSettings}[route.tab],coin:screenCoin,bet:screenBet};
  s.innerHTML=(map[route.page]||screenDash)();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===route.tab?"page":"false"));
  $("sheetRoot").innerHTML=sheetOpen?customizeSheet():"";
  if(scrollTop)window.scrollTo(0,0);
  document.querySelectorAll(".slides").forEach(el=>{const i=Math.min(slideAt[el.dataset.sym]||0,el.children.length-1);if(i>0)el.scrollLeft=i*slidePitch(el)});
  drawCharts();
}
const slidePitch=el=>(el.firstElementChild?el.firstElementChild.offsetWidth:el.clientWidth)+16;
function showSlide(el,i,smooth){el.scrollTo({left:i*slidePitch(el),behavior:smooth&&!REDUCED?"smooth":"auto"})}
document.addEventListener("scroll",e=>{const el=e.target;if(!el.classList||!el.classList.contains("slides"))return; // swipe between 15-minute and ladder charts
  const sym=el.dataset.sym,i=Math.max(0,Math.min(el.children.length-1,Math.round(el.scrollLeft/slidePitch(el))));if((slideAt[sym]||0)===i)return;
  slideAt[sym]=i;const card=el.closest(".livecard");
  if(card){card.querySelectorAll(".dots button").forEach((b,j)=>b.setAttribute("aria-current",String(j===i)));const sm=card.querySelector(".dots small");if(sm)sm.textContent=i?"Ladder":"Swipe for ladders"}
  scheduleLive()},true);
function drawCharts(withStatic=true){
  document.querySelectorAll('[data-live^="chart:"]').forEach(el=>{const k=el.dataset.live.slice(6),L=live[k];if(!L)return;const m=botModel(k),hb=heldBet(k);
    const from=L.kind==="ladder"?Math.max(L.open||0,Date.now()-6*3600e3):L.open;
    el.innerHTML=chanceSVG(L.pts,el.clientWidth||326,+el.dataset.h||150,{from,to:null,model:L.kind==="ladder"||!m?null:m.p,
      entry:hb&&hb.price!=null?(hb.side==="NO"?1-hb.price:hb.price):null,entryT:hb?hb.ts:null})});
  document.querySelectorAll('[data-live^="mini:"]').forEach(el=>{const L=live[el.dataset.live.slice(5)];if(!L)return;el.innerHTML=lineSVG(L.pts.map(p=>p.p),el.clientWidth||326,44)});
  document.querySelectorAll('[data-live^="spark:"]').forEach(el=>{const L=live[el.dataset.live.slice(6)];el.innerHTML=lineSVG(L.pts.map(p=>p.p),64,26)});
  if(!withStatic)return;
  const pc=$("pnlchart");if(pc){const v=pc.dataset.vals.split(",").map(Number);pc.innerHTML=lineSVG(v,pc.clientWidth||326,90,"var(--blue)",true)}
  const bc=$("betchart");if(bc)drawBetChart(bc);
}
function updateLive(){
  document.querySelectorAll('[data-live^="cd:"]').forEach(el=>el.textContent=countdown(el.dataset.live.slice(3)));
  document.querySelectorAll('[data-live^="ch:"]').forEach(el=>el.innerHTML=chanceLine(el.dataset.live.slice(3)));
  document.querySelectorAll('[data-live^="q:"]').forEach(el=>el.textContent=questionOf(el.dataset.live.slice(2)));
  document.querySelectorAll('[data-live^="model:"]').forEach(el=>el.textContent=modelNote(el.dataset.live.slice(6)));
  document.querySelectorAll('[data-live^="spot:"]').forEach(el=>el.textContent=spotLine(el.dataset.live.slice(5)));
  document.querySelectorAll('[data-live^="settle:"]').forEach(el=>el.textContent=settleLine(el.dataset.live.slice(7)));
  document.querySelectorAll('[data-live^="yn:"]').forEach(el=>el.innerHTML=ynTiles(el.dataset.live.slice(3)));
  drawCharts(false);
}
const betCandles={};
async function drawBetChart(el){
  const b=bets.find(x=>String(x.id)===String(route.id));if(!b)return;
  const entry=b.price==null?null:(b.side==="NO"?1-b.price:b.price),end=b.exitTs||((b.coin&&/15M/.test(b.series))?b.ts+16*60000:Date.now());
  const key=b.ticker;
  if(betCandles[key]===undefined&&!sample){betCandles[key]=null;
    const span=(Math.min(end,Date.now())-b.ts)/1000,period=span>1.8*86400?60:1;
    feedJSON("/api/candles?series_ticker="+encodeURIComponent(b.series)+"&ticker="+encodeURIComponent(b.ticker)+"&start_ts="+Math.floor(b.ts/1000-300)+"&end_ts="+Math.floor(Math.min(end,Date.now())/1000)+"&period_interval="+period)
      .then(d=>{betCandles[key]=(d.candlesticks||[]).map(k=>{const p=k.price||{};const v=dollars(p.close_dollars)??dollars((k.yes_bid||{}).close_dollars);return v==null?null:{t:k.end_period_ts*1000,p:v}}).filter(Boolean);if($("betchart"))drawBetChart($("betchart"))})
      .catch(()=>{betCandles[key]=[];if($("betchart"))drawBetChart($("betchart"))});
  }
  let pts=betCandles[key]||[];
  if(sample&&!pts.length){let v=entry??.5;pts=[];for(let i=0;i<30;i++){v=Math.max(.03,Math.min(.97,v+(Math.random()-.5)*.06));pts.push({t:b.ts+i*30000,p:v})}}
  el.innerHTML=pts.length?chanceSVG(pts,el.clientWidth||326,140,{from:b.ts-300000,to:Math.min(end,Date.now()),entry,entryT:b.ts}):(betCandles[key]===null?'<p class="empty">Loading the price history…</p>':'<p class="empty">No price history for this market.</p>');
}

/* ================= actions ================= */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  if(t.dataset.act==="closeSheet"&&e.target.closest("[data-stop]")&&!e.target.closest("button"))return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==="back")return back();
  if(a==="tab")return tab(v);
  if(a==="feat"){ui.feat=v;return render()}
  if(a==="slide"){const el=t.closest(".livecard").querySelector(".slides");return showSlide(el,+t.dataset.i,true)}
  if(a==="coin"){ui.coinTab=t.dataset.sub||"overview";return go({page:"coin",sym:v})}
  if(a==="bet")return go({page:"bet",id:v});
  if(["coinTab","pnlRange","sportsType","league","actView"].includes(a)){ui[a]=v;return render()}
  if(a==="customize"){sheetOpen=true;return render()}
  if(a==="closeSheet"){sheetOpen=false;return render()}
  if(a==="toggleType"){custom.types[v]=custom.types[v]===false;saveCustom();return render()}
  if(a==="toggleLeague"){custom.leagues[v]=custom.leagues[v]===false;saveCustom();return render()}
  if(a==="power"){const on=wfState==="active";try{await gh("/actions/workflows/"+BOT_WF+(on?"/disable":"/enable"),{method:"PUT"});wfState=on?"disabled_manually":"active";toast(on?"Bot paused":"Bot resumed");render()}catch(err){toast(explain(err))}return}
  if(a==="run")return dispatch(BOT_WF,"Run",t);
  if(a==="train")return dispatch(TRAIN_WF,"Training",t);
  if(a==="stop"){try{await gh("/actions/runs/"+v+"/cancel",{method:"POST"});toast("Stopping run");setTimeout(refresh,3000)}catch(err){toast(explain(err))}return}
  if(a==="saveVars")return saveVars(t);
  if(a==="saveBets")return saveBets(t);
  if(a==="resetStats")return resetStats(t);
  if(a==="logout"){localStorage.removeItem("kbot");location.reload()}
});
function saveCustom(){try{localStorage.setItem("kbot_custom",JSON.stringify(custom))}catch(e){}}
async function setVar(name,value){
  try{await gh("/actions/variables/"+name,{method:"PATCH",body:JSON.stringify({name,value})})}
  catch(e){if(e.status===404)await gh("/actions/variables",{method:"POST",body:JSON.stringify({name,value})});else throw e}vars[name]=value}
async function dispatch(wf,lab,btn){btn.disabled=true;
  try{await gh("/actions/workflows/"+wf+"/dispatches",{method:"POST",body:JSON.stringify({ref:"main"})});toast(lab+" started");setTimeout(refresh,4000)}
  catch(e){toast(e.status===422?"This workflow doesn’t allow manual runs.":explain(e))}setTimeout(()=>btn.disabled=false,4000)}
async function saveVars(btn){btn.disabled=true;let n=0;
  try{for(const el of document.querySelectorAll("[data-var]")){const name=el.dataset.var,s=SETTINGS.find(x=>x.name===name);let val=el.value.trim(),old=vars[name]??"";
      if(s.pct&&val!==""){const x=+val;if(!(x>0&&x<100)){toast(s.label+": enter a percent between 0 and 100");continue}val=String(+(x/100).toFixed(6))}
      if(val===old)continue;if(s.type==="select"&&!(name in vars)&&val===s.def)continue;
      if(val===""){await gh("/actions/variables/"+name,{method:"DELETE"}).catch(()=>{});delete vars[name]}else await setVar(name,val);n++}
    toast(n?"Settings saved":"Nothing changed")}catch(e){toast(explain(e))}btn.disabled=false}

/* ================= data refresh ================= */
async function refresh(){
  if(!demo){
    try{const[wf,v,r]=await Promise.all([gh("/actions/workflows/"+BOT_WF),gh("/actions/variables?per_page=50"),gh("/actions/runs?per_page=8")]);
      wfState=wf.state;vars={};v.variables.forEach(x=>vars[x.name]=x.value);runsCache=r.workflow_runs}catch(e){toast(explain(e))}
    try{const txt=await file("bets.csv");const real=txt?toBets(parseCSV(txt)):[];sample=!real.length;bets=real.length?real:sampleBets()}catch(e){sample=true;bets=sampleBets()}
    file("BRIEFING.txt").then(t=>{briefing=t||""}).catch(()=>{});
    file("REPORT.txt").then(t=>{report=t||""}).catch(()=>{});
    file("LIVE.json").then(t=>{try{liveSnap=t?JSON.parse(t):null}catch(e){liveSnap=null}}).catch(()=>{});
  }else{sample=true;bets=sampleBets();briefing="Sample mode. Your bot’s AI briefing shows here once connected.";report="Sample mode."}
  await loadDB().catch(()=>{});
  const editing=document.querySelector("[data-var]:focus,[data-bet]:focus")||[...document.querySelectorAll("[data-bet]")].some(el=>el.value.trim()!==el.dataset.orig);
  if(!editing)render();   // never wipe unsaved bet settings
}
function start(){
  $("setup").hidden=true;$("screen").hidden=false;$("tabs").hidden=false;
  render(true);refresh();
  COINS.forEach(spot);connectWS();
  (async()=>{const order=[COINS.find(x=>x.sym===ui.feat),...COINS.filter(x=>x.sym!==ui.feat)];
    for(const c of order){await discover(c);scheduleLive()}
    for(const c of order){await discoverLadder(c);scheduleLive()}})();
  setInterval(pollMarkets,10000);
  setInterval(()=>{if(document.visibilityState==="visible")COINS.forEach(spot)},10000);
  setInterval(()=>{if(document.visibilityState==="visible")updateLive()},1000);
  setInterval(()=>{if(document.visibilityState==="visible")refresh()},60000);
  addEventListener("resize",()=>drawCharts());
}
$("connectBtn").onclick=async()=>{const token=$("tokenIn").value.trim(),repo=$("repoIn").value.trim();if(!token){toast("Paste your token first.");return}
  cfg={token,repo};demo=false;try{await gh("");localStorage.setItem("kbot",JSON.stringify(cfg));start()}catch(e){cfg=null;toast(explain(e))}};
$("demoBtn").onclick=()=>{demo=true;cfg={repo:"",token:""};start()};
if(cfg)start();else $("setup").hidden=false;
</script>
